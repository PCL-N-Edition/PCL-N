name: Launcher Build
on:
  push:
    branches: [refactor/xsr]
    tags: ['[0-9]*', 'v[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prefix: ${{ steps.version.outputs.prefix }}
      channel: ${{ steps.version.outputs.channel }}
      sequence: ${{ steps.version.outputs.sequence }}
      commit: ${{ steps.version.outputs.commit }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s eng/release -p 'test_*.py'
      - id: version
        run: python eng/release/metadata.py --base origin/dev --output release-metadata
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-metadata
          path: release-metadata/*
  launcher:
    needs: metadata
    name: Launcher ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {rid: win-x64, os: windows-2025}
          - {rid: win-arm64, os: windows-11-arm}
          - {rid: linux-x64, os: ubuntu-24.04}
          - {rid: linux-arm64, os: ubuntu-24.04-arm}
          - {rid: osx-x64, os: macos-15-intel}
          - {rid: osx-arm64, os: macos-15}
    env:
      PRODUCT_VERSION: ${{ needs.metadata.outputs.version }}
      VERSION_PREFIX: ${{ needs.metadata.outputs.prefix }}
      VERSION_CHANNEL: ${{ needs.metadata.outputs.channel }}
      VERSION_SEQUENCE: ${{ needs.metadata.outputs.sequence }}
      COMMIT_SHORT: ${{ needs.metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev libfontconfig1-dev libx11-dev libice6 libsm6 rpm ruby-dev build-essential desktop-file-utils squashfs-tools
          sudo gem install fpm -v 1.16.0 --no-document
          arch=x86_64
          if [[ '${{ matrix.rid }}' == linux-arm64 ]]; then arch=aarch64; fi
          python eng/release/fetch_tool.py "appimagetool-${arch}" "$RUNNER_TEMP/appimagetool"
          python eng/release/fetch_tool.py "runtime-${arch}" "$RUNNER_TEMP/appimage-runtime"
          echo "APPIMAGE_RUNTIME=$RUNNER_TEMP/appimage-runtime" >> "$GITHUB_ENV"
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python eng/release/fetch_tool.py innosetup "$env:RUNNER_TEMP\innosetup.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $innoDirectory = Join-Path $env:RUNNER_TEMP 'nexa-inno'
          $install = Start-Process -FilePath "$env:RUNNER_TEMP\innosetup.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', ('/DIR="' + $innoDirectory + '"') -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) { exit $install.ExitCode }
          "NEXA_ISCC=$innoDirectory\ISCC.exe" >> $env:GITHUB_ENV
      - name: Resolve public OAuth client ids
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          NEXA_MS_CLIENT_ID: ${{ secrets.PCL_MS_CLIENT_ID }}
          LITTLESKIN_CLIENT_ID: ${{ secrets.LITTLESKIN_CLIENT_ID }}
          NEXA_LITTLESKIN_CLIENT_ID: ${{ secrets.PCL_LITTLESKIN_CLIENT_ID }}
        run: |
          set -euo pipefail
          microsoft="${NEXA_MS_CLIENT_ID:-${MS_CLIENT_ID:-${CLIENT_ID:-}}}"
          little_skin="${NEXA_LITTLESKIN_CLIENT_ID:-${LITTLESKIN_CLIENT_ID:-}}"
          if [[ -n "$microsoft" ]]; then echo "::add-mask::$microsoft"; fi
          if [[ -n "$little_skin" ]]; then echo "::add-mask::$little_skin"; fi
          echo "NEXA_MS_CLIENT_ID=$microsoft" >> "$GITHUB_ENV"
          echo "NEXA_LITTLESKIN_CLIENT_ID=$little_skin" >> "$GITHUB_ENV"
      - name: Restore Cloudflare API identity
        shell: bash
        env:
          API_CLIENT_PFX: ${{ secrets.PCLN_API_CLIENT_PFX_BASE64 }}
        run: |
          python - <<'PY'
          import base64, os, pathlib
          encoded = os.environ.get("API_CLIENT_PFX", "")
          if encoded:
              pathlib.Path("Nexa.Desktop/Assets/api-client.pfx").write_bytes(base64.b64decode(encoded, validate=True))
          elif os.environ.get("GITHUB_REF", "").startswith("refs/tags/"):
              raise SystemExit("Cloudflare API identity is required for release builds")
          PY
      - name: Publish NativeAOT launcher
        shell: bash
        run: |
          dotnet publish Nexa.Desktop/Nexa.Desktop.csproj --configuration Release \
            -r '${{ matrix.rid }}' --self-contained true -m:1 -nodeReuse:false \
            -p:PublishAot=true -p:StripSymbols=true \
            -p:XsrVersionPrefix="$VERSION_PREFIX" -p:XsrVersionChannel="$VERSION_CHANNEL" \
            -p:XsrVersionSequence="$VERSION_SEQUENCE" -p:XsrCommitShort="$COMMIT_SHORT" \
            -p:NexaMicrosoftClientId="$NEXA_MS_CLIENT_ID" -p:NexaLittleSkinClientId="$NEXA_LITTLESKIN_CLIENT_ID" \
            --output "$RUNNER_TEMP/launcher"
      - name: Publish isolated NativeAOT JVM host
        if: runner.os != 'macOS'
        shell: bash
        run: |
          dotnet publish Nexa.Jvm.Host/Nexa.Jvm.Host.csproj --configuration Release \
            -r '${{ matrix.rid }}' --self-contained true -m:1 -nodeReuse:false \
            -p:PublishAot=true -p:StripSymbols=true \
            -p:XsrVersionPrefix="$VERSION_PREFIX" -p:XsrVersionChannel="$VERSION_CHANNEL" \
            -p:XsrVersionSequence="$VERSION_SEQUENCE" -p:XsrCommitShort="$COMMIT_SHORT" \
            --output "$RUNNER_TEMP/launcher"
      - name: Smoke-run published executable
        shell: bash
        run: |
          binary="$RUNNER_TEMP/launcher/Nexa.Desktop"
          if [[ '${{ matrix.rid }}' == win-* ]]; then binary="${binary}.exe"; fi
          "$binary" --validate-shell
          "$binary" --validate-setup
      - name: Verify Windows game window integration under NativeAOT
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dotnet publish tests/Nexa.Desktop.Tests/Nexa.Desktop.Tests.csproj -c Release \
            -r '${{ matrix.rid }}' --self-contained true -m:1 -nodeReuse:false \
            -p:PublishAot=true -p:StripSymbols=true --output "$RUNNER_TEMP/window-integration"
          "$RUNNER_TEMP/window-integration/Nexa.Desktop.Tests.exe" --window-integration-smoke
      - name: Build native installers and portable archive
        shell: bash
        run: python eng/release/package.py --payload "$RUNNER_TEMP/launcher" --output artifacts --rid '${{ matrix.rid }}' --version "$PRODUCT_VERSION"
      - name: Verify machine-wide installation on disposable runner
        shell: bash
        run: python eng/release/smoke_install.py artifacts "$PRODUCT_VERSION" '${{ matrix.rid }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Nexa-${{ matrix.rid }}
          path: artifacts/*
          if-no-files-found: error
  distribution:
    needs: [metadata, launcher]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      PRODUCT_VERSION: ${{ needs.metadata.outputs.version }}
      VERSION_CHANNEL: ${{ needs.metadata.outputs.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: Nexa-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-metadata
          path: release-metadata
      - name: Require every package and calculate checksums
        run: python3 eng/release/verify.py artifacts "$PRODUCT_VERSION"
      - name: Sign and independently verify the complete distribution
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: python3 eng/release/sign.py artifacts "$PRODUCT_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Complete-Nexa-distribution
          overwrite: true
          path: |
            artifacts/*
            release-metadata/CHANGELOG.md
      - name: Publish tagged release
        if: needs.metadata.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ "$VERSION_CHANNEL" != stable ]]; then flags+=(--prerelease --latest=false); fi
          # Re-runs on an existing tag update the description and re-attach assets instead of
          # failing; the notes carry the download guide plus the changelog.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Nexa $PRODUCT_VERSION" \
              --notes-file release-metadata/RELEASE.md "${flags[@]}"
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag \
              --title "Nexa $PRODUCT_VERSION" --notes-file release-metadata/RELEASE.md "${flags[@]}"
          fi

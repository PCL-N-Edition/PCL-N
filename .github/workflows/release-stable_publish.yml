name: Publish Avalonia (Release)

permissions:
  contents: write

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to upload assets to
        required: true
        type: string
      skip_patches:
        description: Skip all-history binary patch generation
        required: false
        type: boolean
        default: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { runner: windows-latest, runtime_id: win-x64, architecture: x64, binary_name: PCL.Desktop.exe }
          - { runner: windows-latest, runtime_id: win-arm64, architecture: ARM64, binary_name: PCL.Desktop.exe }
          - { runner: ubuntu-latest, runtime_id: linux-x64, architecture: x64, binary_name: PCL.Desktop }
          - { runner: ubuntu-latest, runtime_id: linux-arm64, architecture: ARM64, binary_name: PCL.Desktop }
          - { runner: macos-latest, runtime_id: osx-x64, architecture: x64, binary_name: PCL.Desktop }
          - { runner: macos-latest, runtime_id: osx-arm64, architecture: ARM64, binary_name: PCL.Desktop }
        runtime:
          - { self_contained: true, variant: SelfContained }
          - { self_contained: false, variant: NoRuntime }
        plugin:
          - { include: true, suffix: WithPlugin }
          - { include: false, suffix: NoPlugin }

    uses: ./.github/workflows/reusable-build.yml
    with:
      configuration: Release
      runner: ${{ matrix.target.runner }}
      runtime_id: ${{ matrix.target.runtime_id }}
      architecture: ${{ matrix.target.architecture }}
      binary_name: ${{ matrix.target.binary_name }}
      self_contained: ${{ matrix.runtime.self_contained }}
      runtime_variant: ${{ matrix.runtime.variant }}_${{ matrix.plugin.suffix }}
      include_plugin: ${{ matrix.plugin.include }}
      plugin_tag: ${{ vars.PCL_PLUGIN_TAG || 'v0.13.0' }}
      channel: release
      version_tag: ${{ github.event.release.tag_name || inputs.tag_name }}
    secrets: inherit

  # Early stub notes (commits only). Full inventory is written after assets/patches.
  changelog:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    continue-on-error: true
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@git-cliff
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate provisional release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_release_notes.py \
            --repo "${{ github.repository }}" \
            --tag "${{ github.event.release.tag_name || inputs.tag_name }}" \
            --repo-root "${{ github.workspace }}" \
            -o RELEASE_NOTES.md \
            --publish \
            --skip-inventory

  publish-assets:
    permissions:
      contents: write
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { runtime_id: win-x64, binary_name: PCL.Desktop.exe, package: zip }
          - { runtime_id: win-arm64, binary_name: PCL.Desktop.exe, package: zip }
          - { runtime_id: linux-x64, binary_name: PCL.Desktop, package: tar }
          - { runtime_id: linux-arm64, binary_name: PCL.Desktop, package: tar }
          - { runtime_id: osx-x64, binary_name: PCL.Desktop, package: tar }
          - { runtime_id: osx-arm64, binary_name: PCL.Desktop, package: tar }
        runtime_variant: [SelfContained, NoRuntime]
        plugin_suffix: [WithPlugin, NoPlugin]
    steps:
      - name: Download Avalonia artifact
        uses: actions/download-artifact@v4
        with:
          name: PCL_N_Release_${{ matrix.target.runtime_id }}_${{ matrix.runtime_variant }}_${{ matrix.plugin_suffix }}
          path: artifact

      - name: Package release asset
        shell: bash
        run: |
          base="PCL_N_Release_${{ matrix.target.runtime_id }}_${{ matrix.runtime_variant }}_${{ matrix.plugin_suffix }}"
          mkdir -p dist
          chmod +x "artifact/${{ matrix.target.binary_name }}" || true
          if [[ "${{ matrix.target.package }}" == "zip" ]]; then
            (cd artifact && zip -9 "../dist/${base}.zip" "${{ matrix.target.binary_name }}")
          elif [[ "${{ matrix.target.runtime_id }}" == osx-* ]]; then
            test -x "artifact/PCL N.app/Contents/MacOS/${{ matrix.target.binary_name }}"
            tar -C artifact -czf "dist/${base}.tar.gz" "PCL N.app"
          else
            tar -C artifact -czf "dist/${base}.tar.gz" "${{ matrix.target.binary_name }}"
          fi

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign release asset
        shell: bash
        run: |
          asset=$(find dist -maxdepth 1 -type f | head -n 1)
          gpg --detach-sign --armor "$asset"
          binary="artifact/${{ matrix.target.binary_name }}"
          if [[ "${{ matrix.target.runtime_id }}" == osx-* ]]; then
            binary="artifact/PCL N.app/Contents/MacOS/${{ matrix.target.binary_name }}"
          fi
          gpg --detach-sign --armor --output "$asset.binary.asc" "$binary"

      - name: Upload Avalonia assets to release
        uses: softprops/action-gh-release@v2.5.0
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag_name }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # After full builds are on the Release, generate Patch from every prior version → this tag.
  generate-patches:
    name: Generate version patches
    needs: [publish-assets]
    if: ${{ always() && needs.publish-assets.result == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.skip_patches) }}
    uses: ./.github/workflows/generate-launcher-patches.yml
    with:
      target_tag: ${{ github.event.release.tag_name || inputs.tag_name }}
      configuration: Release
      max_from_versions: 10
      hop_interval: 10
      include_prerelease_history: false
    secrets:
      PATCHES_REPO_TOKEN: ${{ secrets.PATCHES_REPO_TOKEN }}

  # Final notes: changelog + structured Release inventory (after packages ± patches).
  finalize-release-notes:
    name: Finalize release notes
    needs: [publish-assets, generate-patches]
    if: ${{ always() && needs.publish-assets.result == 'success' }}
    uses: ./.github/workflows/update-release-notes.yml
    with:
      tag_name: ${{ github.event.release.tag_name || inputs.tag_name }}
      cleanup_legacy: true

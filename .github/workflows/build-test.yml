name: Build (CI)

# Builds on every push/PR. On push to dev (not PR), publishes a rolling
# rolling "ci-latest" block set for the launcher CI update channel in R2.
# Intentionally does NOT generate version patches.

permissions:
  contents: read

concurrency:
  group: pcln-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [dev]
    paths-ignore: &ignored
      - '**/.editorconfig'
      - '**/.gitignore'
      - '**/.gitattributes'
      - '**/*.md'
      - '**/LICENSE'
      - '**/LICENCE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
  pull_request:
    paths-ignore: *ignored
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - configuration: CI
            runner: windows-latest
            runtime_id: win-x64
            architecture: x64
            binary_name: PCL-N-Edition.exe
          - configuration: CI
            runner: windows-latest
            runtime_id: win-arm64
            architecture: ARM64
            binary_name: PCL-N-Edition.exe
          - configuration: CI
            runner: ubuntu-latest
            runtime_id: linux-x64
            architecture: x64
            binary_name: PCL-N-Edition
          - configuration: CI
            runner: ubuntu-24.04-arm
            runtime_id: linux-arm64
            architecture: ARM64
            binary_name: PCL-N-Edition
          - configuration: CI
            runner: macos-latest
            runtime_id: osx-x64
            architecture: x64
            binary_name: PCL-N-Edition
          - configuration: CI
            runner: macos-latest
            runtime_id: osx-arm64
            architecture: ARM64
            binary_name: PCL-N-Edition
      fail-fast: false

    uses: ./.github/workflows/reusable-build.yml
    with:
      configuration: ${{ matrix.configuration }}
      runner: ${{ matrix.runner }}
      runtime_id: ${{ matrix.runtime_id }}
      architecture: ${{ matrix.architecture }}
      binary_name: ${{ matrix.binary_name }}
      self_contained: true
      runtime_variant: SelfContained
      # Rolling CI only distributes the scatter updater package. Avoid a second
      # NativeAOT publish and 160 MiB internal artifact that will never be used.
      build_portable: false
      # PRs from forks cannot read secrets; only require CLIENT_ID on non-PR runs.
      require_ms_client_id: ${{ github.event_name != 'pull_request' }}
      channel: ci
    secrets: inherit

  # Rolling CI package for the "CI" update channel. Content-addressed blocks only — never patches.
  publish-ci-rolling:
    name: Publish ci-latest (no patches)
    needs: [build]
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release needs a git context / GH_REPO; checkout the repo at the built SHA.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all CI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: PCL_N_CI_*
          path: artifacts
          merge-multiple: false

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Package CI assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist block-dist
          mkdir -p dist/archives dist/r2-metadata block-dist
          # artifacts/<artifact-name>/{scatter,portable}; only scatter is an update.
          for dir in artifacts/PCL_N_CI_*; do
            [[ -d "$dir" ]] || continue
            name="$(basename "$dir")"
            scatter="$dir/scatter"
            test -d "$scatter" || { echo "Missing scatter/ build product in $dir"; exit 1; }
            # Prefer Windows executable, then macOS bundle, then bare Unix binary.
            bin=""
            platform=""
            if [[ -f "$scatter/PCL-N-Edition.exe" ]]; then
              bin="$scatter/PCL-N-Edition.exe"
              platform="windows"
            elif [[ -f "$scatter/PCL N.app/Contents/MacOS/PCL-N-Edition" ]]; then
              bin="$scatter/PCL N.app/Contents/MacOS/PCL-N-Edition"
              platform="macos"
            elif [[ -f "$scatter/PCL-N-Edition" ]]; then
              bin="$scatter/PCL-N-Edition"
              platform="linux"
            else
              echo "No launcher entry in $scatter"; continue
            fi
            chmod +x "$bin" || true
            if [[ "$name" == *"_win-"* ]]; then
              package="dist/archives/${name}.zip"
            else
              package="dist/archives/${name}.tar.gz"
            fi
            python scripts/package_update_archive.py \
              --artifact "$scatter" \
              --output "$package" \
              --platform "$platform"
            if [[ ! "$name" =~ ^PCL_N_CI_((win|linux|osx)-(x64|arm64))_SelfContained$ ]]; then
              echo "::error::Cannot derive CI block-map identity from $name"
              exit 1
            fi
            python scripts/generate_update_blockmap.py \
              --archive "$package" \
              --output block-dist \
              --target-tag ci-latest \
              --target-version ci-latest \
              --runtime-id "${BASH_REMATCH[1]}" \
              --runtime-variant SelfContained \
              --configuration CI
            gpg --detach-sign --armor \
              --output "dist/r2-metadata/$(basename "$package").binary.asc" "$bin"
            package_sha256="$(sha256sum "$package" | awk '{print $1}')"
            package_size="$(stat -c '%s' "$package")"
            cat > "dist/r2-metadata/${name}.ci.json" <<EOF
          {
            "formatVersion": 1,
            "channel": "CI",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "runId": "${{ github.run_id }}",
            "artifact": "${name}",
            "packageSha256": "${package_sha256}",
            "packageSize": ${package_size},
            "supportsPatches": false,
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          done
          while IFS= read -r -d '' map; do
            gpg --detach-sign --armor "$map"
            cp -a "$map" "$map.asc" dist/r2-metadata/
          done < <(find block-dist/manifests -maxdepth 1 -type f -name '*.blockmap.json' -print0)
          cat > dist/r2-metadata/ci-channel.json <<EOF
          {
            "formatVersion": 1,
            "tag": "ci-latest",
            "version": "ci-${GITHUB_SHA:0:7}",
            "channel": "ci",
            "commitSha": "${{ github.sha }}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "manifestKey": "releases/ci-latest/ci-channel.json"
          }
          EOF
          find dist/r2-metadata -maxdepth 1 -type f -printf '  %f\n' | sort
          test -n "$(find block-dist/manifests -maxdepth 1 -type f -name '*.blockmap.json' -print -quit)" || {
            echo "No CI block maps produced"; exit 1;
          }

      - name: Publish rolling CI assets to Cloudflare R2
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          npx --yes wrangler@4.120.0 --version
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          # Upload immutable blocks first. Canonical archives in dist/archives
          # are temporary and intentionally never leave the runner.
          find block-dist/block -type f -print0 | xargs -0 -r -P 6 -I '{}' \
            bash -c '
              set -euo pipefail
              block="$1"
              relative="${block#block-dist/}"
              npx --yes wrangler@4.120.0 r2 object put \
                "pcln-releases/${relative}" --file "$block" --remote
            ' _ '{}'

          # Publish maps and signatures before moving the discoverable marker.
          while IFS= read -r -d '' asset; do
            name="$(basename "$asset")"
            if [[ ! "$name" =~ ^PCL_N_CI_(win|linux|osx)-(x64|arm64)_SelfContained\.(zip|tar\.gz)\.binary\.asc$ &&
                  ! "$name" =~ ^PCL_N_CI_(win|linux|osx)-(x64|arm64)_SelfContained\.(ci|blockmap)\.json(\.asc)?$ ]]; then
              echo "::error::Unexpected CI updater metadata: $name"
              exit 1
            fi
            npx --yes wrangler@4.120.0 r2 object put \
              "pcln-releases/releases/ci-latest/${name}" \
              --file "$asset" --remote
          done < <(find dist/r2-metadata -maxdepth 1 -type f ! -name 'ci-channel.json' -print0 | sort -z)

          # Purge full rolling archives left by the pre-block CI publisher.
          while IFS= read -r -d '' archive; do
            name="$(basename "$archive")"
            printf 'releases/ci-latest/%s\nreleases/ci-latest/%s.asc\n' "$name" "$name"
          done < <(find dist/archives -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0) \
            | xargs -r -P 6 -I '{}' sh -c '
                npx --yes wrangler@4.120.0 r2 object delete \
                  "pcln-releases/$1" --remote --force || true
              ' _ '{}'

          # ci-latest is replaced in-place. Catalog replacement immediately
          # removes blocks unique to the preceding CI build while preserving
          # blocks shared by Beta/Release or the new CI build.
          rm -f block-catalog.previous.json block-catalog.next.json obsolete-r2-objects.txt
          npx --yes wrangler@4.120.0 r2 object get \
            "pcln-releases/block/catalog.json" \
            --file block-catalog.previous.json --remote || rm -f block-catalog.previous.json
          python scripts/update_update_block_catalog.py \
            --catalog block-catalog.previous.json \
            --manifest-dir block-dist/manifests \
            --asset-dir dist/r2-metadata \
            --tag ci-latest \
            --channel ci \
            --published-at "$(jq -r .publishedAt dist/r2-metadata/ci-channel.json)" \
            --output block-catalog.next.json \
            --delete-list obsolete-r2-objects.txt
          xargs -r -P 6 -I '{}' \
            npx --yes wrangler@4.120.0 r2 object delete \
              "pcln-releases/{}" --remote --force < obsolete-r2-objects.txt
          npx --yes wrangler@4.120.0 r2 object put \
            "pcln-releases/block/catalog.json" \
            --file block-catalog.next.json --remote

          # Publish both markers last so a client never observes the new SHA
          # before all signed maps and blocks are reachable.
          npx --yes wrangler@4.120.0 r2 object put \
            "pcln-releases/releases/ci-latest/ci-channel.json" \
            --file dist/r2-metadata/ci-channel.json --remote
          npx --yes wrangler@4.120.0 r2 object put \
            "pcln-releases/channels/ci.json" \
            --file dist/r2-metadata/ci-channel.json --remote

name: Build (CI)

# Builds on every push/PR. On push to dev (not PR), publishes a rolling
# "ci-latest" GitHub Release for the launcher CI update channel.
# Intentionally does NOT generate version patches.

permissions:
  contents: read

concurrency:
  group: pcln-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [dev]
    paths-ignore: &ignored
      - '**/.editorconfig'
      - '**/.gitignore'
      - '**/.gitattributes'
      - '**/*.md'
      - '**/LICENSE'
      - '**/LICENCE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
  pull_request:
    paths-ignore: *ignored
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - configuration: CI
            runner: windows-latest
            runtime_id: win-x64
            architecture: x64
            binary_name: PCL-N-Edition.exe
          - configuration: CI
            runner: windows-latest
            runtime_id: win-arm64
            architecture: ARM64
            binary_name: PCL-N-Edition.exe
          - configuration: CI
            runner: ubuntu-latest
            runtime_id: linux-x64
            architecture: x64
            binary_name: PCL-N-Edition
          - configuration: CI
            runner: ubuntu-24.04-arm
            runtime_id: linux-arm64
            architecture: ARM64
            binary_name: PCL-N-Edition
          - configuration: CI
            runner: macos-latest
            runtime_id: osx-x64
            architecture: x64
            binary_name: PCL-N-Edition
          - configuration: CI
            runner: macos-latest
            runtime_id: osx-arm64
            architecture: ARM64
            binary_name: PCL-N-Edition
      fail-fast: false

    uses: ./.github/workflows/reusable-build.yml
    with:
      configuration: ${{ matrix.configuration }}
      runner: ${{ matrix.runner }}
      runtime_id: ${{ matrix.runtime_id }}
      architecture: ${{ matrix.architecture }}
      binary_name: ${{ matrix.binary_name }}
      self_contained: true
      runtime_variant: SelfContained
      # Rolling CI only distributes the scatter updater package. Avoid a second
      # NativeAOT publish and 160 MiB internal artifact that will never be used.
      build_portable: false
      # PRs from forks cannot read secrets; only require CLIENT_ID on non-PR runs.
      require_ms_client_id: ${{ github.event_name != 'pull_request' }}
      channel: ci
    secrets: inherit

  # Rolling CI package for the "CI" update channel. Full binaries only — never patches.
  publish-ci-rolling:
    name: Publish ci-latest (no patches)
    needs: [build]
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release needs a git context / GH_REPO; checkout the repo at the built SHA.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all CI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: PCL_N_CI_*
          path: artifacts
          merge-multiple: false

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Package CI assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # artifacts/<artifact-name>/{scatter,portable}; only scatter is an update.
          for dir in artifacts/PCL_N_CI_*; do
            [[ -d "$dir" ]] || continue
            name="$(basename "$dir")"
            scatter="$dir/scatter"
            test -d "$scatter" || { echo "Missing scatter/ build product in $dir"; exit 1; }
            # Prefer Windows executable, then macOS bundle, then bare Unix binary.
            bin=""
            platform=""
            if [[ -f "$scatter/PCL-N-Edition.exe" ]]; then
              bin="$scatter/PCL-N-Edition.exe"
              platform="windows"
            elif [[ -f "$scatter/PCL N.app/Contents/MacOS/PCL-N-Edition" ]]; then
              bin="$scatter/PCL N.app/Contents/MacOS/PCL-N-Edition"
              platform="macos"
            elif [[ -f "$scatter/PCL-N-Edition" ]]; then
              bin="$scatter/PCL-N-Edition"
              platform="linux"
            else
              echo "No launcher entry in $scatter"; continue
            fi
            chmod +x "$bin" || true
            if [[ "$name" == *"_win-"* ]]; then
              package="dist/${name}.zip"
            else
              package="dist/${name}.tar.gz"
            fi
            python scripts/package_update_archive.py \
              --artifact "$scatter" \
              --output "$package" \
              --platform "$platform"
            gpg --detach-sign --armor "$package"
            gpg --detach-sign --armor --output "$package.binary.asc" "$bin"
            package_sha256="$(sha256sum "$package" | awk '{print $1}')"
            package_size="$(stat -c '%s' "$package")"
            cat > "dist/${name}.ci.json" <<EOF
          {
            "formatVersion": 1,
            "channel": "CI",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "runId": "${{ github.run_id }}",
            "artifact": "${name}",
            "packageSha256": "${package_sha256}",
            "packageSize": ${package_size},
            "supportsPatches": false,
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          done
          cat > dist/ci-channel.json <<EOF
          {
            "formatVersion": 1,
            "tag": "ci-latest",
            "version": "ci-${GITHUB_SHA:0:7}",
            "channel": "ci",
            "commitSha": "${{ github.sha }}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "manifestKey": "releases/ci-latest/ci-channel.json"
          }
          EOF
          ls -la dist
          test -n "$(ls -A dist/*.zip 2>/dev/null)" || { echo "No CI zips produced"; exit 1; }

      - name: Publish rolling CI assets to Cloudflare R2
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          # Replace packages and signatures first, then per-RID metadata. The
          # channel marker is uploaded last so readers never observe a new SHA
          # before all files for that build are available.
          while IFS= read -r -d '' asset; do
            name="$(basename "$asset")"
            npx --yes wrangler@4.120.0 r2 object put \
              "pcln-releases/releases/ci-latest/${name}" \
              --file "$asset" --remote
          done < <(find dist -maxdepth 1 -type f ! -name '*.ci.json' ! -name 'ci-channel.json' -print0 | sort -z)
          while IFS= read -r -d '' asset; do
            name="$(basename "$asset")"
            npx --yes wrangler@4.120.0 r2 object put \
              "pcln-releases/releases/ci-latest/${name}" \
              --file "$asset" --remote
          done < <(find dist -maxdepth 1 -type f -name '*.ci.json' -print0 | sort -z)
          npx --yes wrangler@4.120.0 r2 object put \
            "pcln-releases/releases/ci-latest/ci-channel.json" \
            --file dist/ci-channel.json --remote
          npx --yes wrangler@4.120.0 r2 object put \
            "pcln-releases/channels/ci.json" \
            --file dist/ci-channel.json --remote

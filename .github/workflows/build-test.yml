name: Build (CI)

# Builds on every push/PR. On push to dev (not PR), publishes a rolling
# "ci-latest" GitHub Release for the launcher CI update channel.
# Intentionally does NOT generate version patches.

permissions:
  contents: read

on:
  push:
    branches: [dev]
    paths-ignore: &ignored
      - '**/.editorconfig'
      - '**/.gitignore'
      - '**/.gitattributes'
      - '**/*.md'
      - '**/LICENSE'
      - '**/LICENCE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
  pull_request:
    paths-ignore: *ignored
  workflow_dispatch:

jobs:
  resolve-plugin-version:
    name: Resolve plugin release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag || steps.skipped.outputs.tag }}
    steps:
      - name: Resolve latest PCL.Plugin release
        if: ${{ github.event_name != 'pull_request' }}
        id: release
        env:
          GH_TOKEN: ${{ secrets.PCL_PLUGIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::PCL_PLUGIN_TOKEN is required to resolve the private PCL.Plugin release."
            exit 1
          fi
          required=(
            PCL.Plugin.dll
            PCL.N.Plugin.Abstractions.dll
            PCL.N.Plugin.i18n.dll
            PCL.N.Plugin.Sdk.dll
            PCL.N.Plugin.UI.dll
            PCL.N.Plugin.UI.Avalonia.dll
            0Harmony.dll
            BouncyCastle.Cryptography.dll
            jsoncanonicalizer.dll
            es6numberserializer.dll
          )
          # Fresh releases can briefly publish with zero assets while upload finishes.
          for attempt in 1 2 3 4 5 6; do
            tag="$(gh api repos/PCL-N-Edition/PCL.Plugin/releases/latest --jq .tag_name)"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]] || {
              echo "::error::Invalid PCL.Plugin release tag: $tag"
              exit 1
            }
            assets_json="$(gh api "repos/PCL-N-Edition/PCL.Plugin/releases/tags/${tag}" --jq '[.assets[].name]')"
            missing=0
            for name in "${required[@]}"; do
              if ! echo "$assets_json" | grep -Fq "\"${name}\""; then
                missing=1
                break
              fi
              if ! echo "$assets_json" | grep -Fq "\"${name}.sha256\""; then
                missing=1
                break
              fi
            done
            if [[ "$missing" -eq 0 ]]; then
              echo "Resolved PCL.Plugin release: $tag"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "PCL.Plugin release $tag is incomplete (attempt $attempt/6); waiting for assets..."
            sleep $((attempt * 10))
          done
          echo "::error::PCL.Plugin latest release has no complete asset set after retries."
          exit 1
      - name: Skip plugin resolution for pull requests
        if: ${{ github.event_name == 'pull_request' }}
        id: skipped
        shell: bash
        run: echo "tag=latest" >> "$GITHUB_OUTPUT"

  build:
    needs: [resolve-plugin-version]
    strategy:
      matrix:
        include:
          - configuration: CI
            runner: windows-latest
            runtime_id: win-x64
            architecture: x64
            binary_name: PCL.Desktop.exe
          - configuration: CI
            runner: windows-latest
            runtime_id: win-arm64
            architecture: ARM64
            binary_name: PCL.Desktop.exe
          - configuration: CI
            runner: ubuntu-latest
            runtime_id: linux-x64
            architecture: x64
            binary_name: PCL.Desktop
          - configuration: CI
            runner: ubuntu-latest
            runtime_id: linux-arm64
            architecture: ARM64
            binary_name: PCL.Desktop
          - configuration: CI
            runner: macos-latest
            runtime_id: osx-x64
            architecture: x64
            binary_name: PCL.Desktop
          - configuration: CI
            runner: macos-latest
            runtime_id: osx-arm64
            architecture: ARM64
            binary_name: PCL.Desktop
      fail-fast: false

    uses: ./.github/workflows/reusable-build.yml
    with:
      configuration: ${{ matrix.configuration }}
      runner: ${{ matrix.runner }}
      runtime_id: ${{ matrix.runtime_id }}
      architecture: ${{ matrix.architecture }}
      binary_name: ${{ matrix.binary_name }}
      self_contained: true
      runtime_variant: SelfContained
      include_plugin: ${{ github.event_name != 'pull_request' }}
      plugin_tag: ${{ needs.resolve-plugin-version.outputs.tag }}
      # PRs from forks cannot read secrets; only require CLIENT_ID on non-PR runs.
      require_ms_client_id: ${{ github.event_name != 'pull_request' }}
      channel: ci
    secrets: inherit

  # Rolling CI package for the "CI" update channel. Full binaries only — never patches.
  publish-ci-rolling:
    name: Publish ci-latest (no patches)
    needs: [build]
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release needs a git context / GH_REPO; checkout the repo at the built SHA.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all CI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: PCL_N_CI_*
          path: artifacts
          merge-multiple: false

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Package CI assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # artifacts/<artifact-name>/<binary>
          for dir in artifacts/PCL_N_CI_*; do
            [[ -d "$dir" ]] || continue
            name="$(basename "$dir")"
            # Prefer Windows executable, then macOS bundle, then bare Unix binary.
            bin=""
            package_source=""
            if [[ -f "$dir/PCL.Desktop.exe" ]]; then
              bin="$dir/PCL.Desktop.exe"
              package_source="PCL.Desktop.exe"
            elif [[ -f "$dir/PCL N.app/Contents/MacOS/PCL.Desktop" ]]; then
              bin="$dir/PCL N.app/Contents/MacOS/PCL.Desktop"
              package_source="PCL N.app"
            elif [[ -f "$dir/PCL.Desktop" ]]; then
              bin="$dir/PCL.Desktop"
              package_source="PCL.Desktop"
            else
              echo "No binary in $dir"; continue
            fi
            chmod +x "$bin" || true
            if [[ "$name" == *"_win-"* ]]; then
              package="dist/${name}.zip"
              (cd "$dir" && zip -9 "../../${package}" "$package_source")
            else
              package="dist/${name}.tar.gz"
              tar -C "$dir" -czf "$package" "$package_source"
            fi
            gpg --detach-sign --armor "$package"
            gpg --detach-sign --armor --output "$package.binary.asc" "$bin"
            cat > "dist/${name}.ci.json" <<EOF
          {
            "channel": "CI",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "runId": "${{ github.run_id }}",
            "artifact": "${name}",
            "supportsPatches": false,
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          done
          ls -la dist
          test -n "$(ls -A dist/*.zip 2>/dev/null)" || { echo "No CI zips produced"; exit 1; }

      - name: Publish / replace rolling ci-latest release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="ci-latest"
          TITLE="CI ${{ github.sha }}"
          NOTES="$(cat <<'EOF'
          Rolling CI build from the **dev** branch workflow.

          ```
          commit: ${{ github.sha }}
          ref: ${{ github.ref }}
          run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ```

          - **Channel:** CI (full package only)
          - **Patches:** not generated for CI builds
          EOF
          )"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TITLE" \
              --prerelease \
              --target "${{ github.sha }}" \
              --notes "$NOTES"
          else
            gh release create "$TAG" \
              --title "$TITLE" \
              --prerelease \
              --target "${{ github.sha }}" \
              --notes "$NOTES"
          fi

          # Full package only — never attach .hdiff patches here.
          gh release upload "$TAG" dist/* --clobber

name: Build (CI)

# Builds on every push/PR. On push to dev (not PR), publishes a rolling
# rolling "ci-latest" block set for the launcher CI update channel in R2.
# Intentionally does NOT generate version patches.

permissions:
  contents: read

concurrency:
  group: pcln-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [dev]
    paths-ignore: &ignored
      - '**/.editorconfig'
      - '**/.gitignore'
      - '**/.gitattributes'
      - '**/*.md'
      - '**/LICENSE'
      - '**/LICENCE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
  pull_request:
    paths-ignore: *ignored
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - configuration: CI
            runner: windows-latest
            runtime_id: win-x64
            architecture: x64
            binary_name: PCL-N-Edition.exe
          - configuration: CI
            runner: windows-latest
            runtime_id: win-arm64
            architecture: ARM64
            binary_name: PCL-N-Edition.exe
          - configuration: CI
            runner: ubuntu-latest
            runtime_id: linux-x64
            architecture: x64
            binary_name: PCL-N-Edition
          - configuration: CI
            runner: ubuntu-24.04-arm
            runtime_id: linux-arm64
            architecture: ARM64
            binary_name: PCL-N-Edition
          - configuration: CI
            runner: macos-latest
            runtime_id: osx-x64
            architecture: x64
            binary_name: PCL-N-Edition
          - configuration: CI
            runner: macos-latest
            runtime_id: osx-arm64
            architecture: ARM64
            binary_name: PCL-N-Edition
      fail-fast: false

    uses: ./.github/workflows/reusable-build.yml
    with:
      configuration: ${{ matrix.configuration }}
      runner: ${{ matrix.runner }}
      runtime_id: ${{ matrix.runtime_id }}
      architecture: ${{ matrix.architecture }}
      binary_name: ${{ matrix.binary_name }}
      self_contained: true
      runtime_variant: SelfContained
      # CI update channel is Windows portable single-file only (scatter cannot
      # use CI). Other RIDs still compile for verification; only win-* publish
      # rolling blockmaps into ci-latest.
      build_portable: ${{ github.event_name != 'pull_request' && startsWith(matrix.runtime_id, 'win-') }}
      # PRs from forks cannot read secrets; only require CLIENT_ID on non-PR runs.
      require_ms_client_id: ${{ github.event_name != 'pull_request' }}
      channel: ci
    secrets: inherit

  # Protocol v2 gate: unit tests + fixed-corpus reuse/incremental benchmarks (§18).
  update-protocol-v2:
    name: Update protocol v2 gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install --upgrade pip 'zstandard>=0.22'
      - name: Python unit tests (blockmap / CAS / VCDIFF / catalog)
        run: |
          python -m unittest \
            scripts.tests.test_generate_update_blockmap \
            scripts.tests.test_pcln_vcdiff \
            scripts.tests.test_upload_r2_cas \
            scripts.tests.test_update_update_block_catalog \
            -v
      - name: Offline structural validate sample maps
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          export PYTHONPATH="${GITHUB_WORKSPACE}/scripts${PYTHONPATH:+:$PYTHONPATH}"
          python - <<PY
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import generate_update_blockmap as b
          root = Path(r"""$tmp""")
          sample = root / "sample.bin"
          sample.write_bytes(b"pcln-v2-validate-" * 8000)
          maps = b.build_file_blockmap(
              sample, root / "dist",
              target_asset_name="sample.bin",
              entry_name="sample.bin",
              target_tag="v0.0.0-test",
              target_version="0.0.0-test",
              runtime_id="win-x64",
              runtime_variant="SelfContained",
              configuration="Beta",
              profiles=[b.PROFILES["v2"]],
          )
          print("maps", [m.name for m in maps])
          PY
          python scripts/validate_update_release.py \
            --manifest-dir "$tmp/dist/manifests" \
            --local-root "$tmp/dist"
      - name: Benchmark gate (synthetic 1.4.3→1.4.4 corpus)
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}/scripts${PYTHONPATH:+:$PYTHONPATH}"
          python scripts/benchmark_update_v2.py

  ui-next-benchmark:
    name: PCL.UI.Next contract and benchmark gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Verify frozen Runtime API
        run: dotnet build PCL.UI.Next/PCL.UI.Next.csproj -c Release --nologo -warnaserror
      - name: Run Runtime contract tests
        run: dotnet test PCL.UI.Next.Test/PCL.UI.Next.Test.csproj -c Release --nologo
      - name: Run deterministic UI benchmark gate
        run: dotnet run --project PCL.UI.Next.Benchmarks/PCL.UI.Next.Benchmarks.csproj -c Release -- --verify

  # Rolling CI package for the "CI" update channel. Content-addressed blocks only — never patches.
  publish-ci-rolling:
    name: Publish ci-latest (no patches)
    needs: [build]
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch') }}
    concurrency:
      # The rolling CI pointer shares one global block catalog with Beta and
      # Release. Serialize only the publishing job; builds may still run in parallel.
      group: release-publish-cloudflare
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release needs a git context / GH_REPO; checkout the repo at the built SHA.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all CI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: PCL_N_CI_*
          path: artifacts
          merge-multiple: false

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Package CI assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist block-dist
          mkdir -p dist/r2-metadata block-dist
          # CI channel = Windows portable single-file only (scatter clients cannot use CI).
          # Linux/macOS CI matrix jobs are compile verification only.
          for dir in artifacts/PCL_N_CI_*; do
            [[ -d "$dir" ]] || continue
            name="$(basename "$dir")"
            if [[ ! "$name" =~ ^PCL_N_CI_((win|linux|osx)-(x64|arm64))_SelfContained$ ]]; then
              echo "::error::Cannot derive CI block-map identity from $name"
              exit 1
            fi
            runtime_id="${BASH_REMATCH[1]}"
            if [[ "$name" != PCL_N_CI_win-* ]]; then
              echo "Skip non-Windows CI artifact for rolling channel: $name"
              continue
            fi
            portable="$dir/portable/PCL-N-Edition.exe"
            test -s "$portable" || { echo "Missing portable CI product in $dir"; exit 1; }
            portable_name="${name}_Portable.exe"
            portable_stem="${portable_name%.exe}"
            python scripts/generate_update_blockmap.py \
              --file "$portable" \
              --target-asset-name "$portable_name" \
              --entry-name PCL-N-Edition.exe \
              --output block-dist \
              --target-tag ci-latest \
              --target-version ci-latest \
              --runtime-id "$runtime_id" \
              --runtime-variant SelfContained \
              --configuration CI \
              --profile auto
            gpg --detach-sign --armor \
              --output "dist/r2-metadata/${portable_name}.asc" "$portable"
            portable_sha256="$(sha256sum "$portable" | awk '{print $1}')"
            portable_size="$(stat -c '%s' "$portable")"
            cat > "dist/r2-metadata/${portable_stem}.ci.json" <<EOF
          {
            "formatVersion": 1,
            "channel": "CI",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "runId": "${{ github.run_id }}",
            "artifact": "${portable_stem}",
            "packageSha256": "${portable_sha256}",
            "packageSize": ${portable_size},
            "supportsPatches": false,
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          done
          cat > dist/r2-metadata/ci-channel.json <<EOF
          {
            "formatVersion": 1,
            "tag": "ci-latest",
            "version": "ci-${GITHUB_SHA:0:7}",
            "channel": "ci",
            "commitSha": "${{ github.sha }}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "manifestKey": "releases/ci-latest/ci-channel.json"
          }
          EOF
          find dist/r2-metadata -maxdepth 1 -type f -printf '  %f\n' | sort
          test -n "$(find block-dist/manifests -maxdepth 1 -type f \( -name '*.blockmap.json' -o -name '*.blockmap.v2.json' \) -print -quit)" || {
            echo "No CI block maps produced"; exit 1;
          }

      - name: Publish rolling CI assets to Cloudflare R2
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: pcln-releases
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          python -m pip install --quiet 'zstandard>=0.22' || true

          # CAS blocks + deltas via Cloudflare API (token reused; batch inventory skip).
          python scripts/upload_r2_cas.py upload-tree block-dist \
            --prefix block --prefix delta \
            --concurrency 24

          # Existing raw-SHA keys keep their first representation. Repair the
          # rolling map to describe those canonical bytes, then sign the result.
          python scripts/reconcile_update_blockmaps.py \
            --manifest-dir block-dist/manifests \
            --local-root block-dist \
            --apply \
            --require-remote \
            --concurrency 8
          while IFS= read -r -d '' map; do
            gpg --detach-sign --armor "$map"
            cp -a "$map" "$map.asc" dist/r2-metadata/
          done < <(find block-dist/manifests -maxdepth 1 -type f \( -name '*.blockmap.json' -o -name '*.blockmap.v2.json' \) -print0)

          python scripts/validate_update_release.py \
            --manifest-dir block-dist/manifests \
            --local-root block-dist \
            --require-remote

          # Publish maps and signatures before moving the discoverable marker.
          while IFS= read -r -d '' asset; do
            name="$(basename "$asset")"
            if [[ ! "$name" =~ ^PCL_N_CI_win-(x64|arm64)_SelfContained_Portable\.(exe\.asc|ci\.json|blockmap(\.v2)?\.json(\.asc)?)$ ]]; then
              echo "::error::Unexpected CI updater metadata: $name"
              exit 1
            fi
          done < <(find dist/r2-metadata -maxdepth 1 -type f ! -name 'ci-channel.json' -print0 | sort -z)
          python scripts/upload_r2_cas.py put-files dist/r2-metadata \
            --key-prefix releases/ci-latest \
            --exclude ci-channel.json \
            --concurrency 16

          # ci-latest is replaced in-place. Catalog replacement immediately
          # removes blocks unique to the preceding CI build while preserving
          # blocks shared by Beta/Release or the new CI build.
          rm -f block-catalog.previous.json block-catalog.next.json obsolete-r2-objects.txt
          python scripts/upload_r2_cas.py get block/catalog.json \
            --file block-catalog.previous.json || rm -f block-catalog.previous.json
          python scripts/update_update_block_catalog.py \
            --catalog block-catalog.previous.json \
            --manifest-dir block-dist/manifests \
            --asset-dir dist/r2-metadata \
            --tag ci-latest \
            --channel ci \
            --published-at "$(jq -r .publishedAt dist/r2-metadata/ci-channel.json)" \
            --output block-catalog.next.json \
            --delete-list obsolete-r2-objects.txt
          if [[ -s obsolete-r2-objects.txt ]]; then
            python scripts/upload_r2_cas.py delete-list obsolete-r2-objects.txt --concurrency 16
          fi
          python scripts/upload_r2_cas.py put block/catalog.json \
            --file block-catalog.next.json

          # Publish both markers last so a client never observes the new SHA
          # before all signed maps and blocks are reachable.
          python scripts/upload_r2_cas.py put releases/ci-latest/ci-channel.json \
            --file dist/r2-metadata/ci-channel.json
          python scripts/upload_r2_cas.py put channels/ci.json \
            --file dist/r2-metadata/ci-channel.json

name: Generate launcher patches

# Called after full launcher assets are on a GitHub Release.
# Builds HDiffPatch for the last N predecessors (+ hop anchors) → target tag.

on:
  workflow_call:
    inputs:
      target_tag:
        description: Release tag that was just published (e.g. v1.2.3)
        required: true
        type: string
      configuration:
        description: Release or Beta (asset name prefix PCL_N_<configuration>_…)
        required: true
        type: string
      max_from_versions:
        description: Direct patches from the last N versions (default 10)
        required: false
        type: number
        default: 10
      hop_interval:
        description: Multi-hop planning stride for clients (e.g. 1→11→21 when 10)
        required: false
        type: number
        default: 10
      include_prerelease_history:
        required: false
        type: boolean
        default: false
    secrets:
      # Optional: mirror patch release to a dedicated patches repository
      PATCHES_REPO_TOKEN:
        required: false
  # Re-run only the patch stage against an existing release (no full rebuild).
  workflow_dispatch:
    inputs:
      target_tag:
        description: Existing release tag to patch TO (e.g. v1.1.6-release)
        required: true
        type: string
      configuration:
        description: Release or Beta
        required: false
        default: Release
        type: choice
        options: [Release, Beta]
      max_from_versions:
        description: Direct patches from the last N versions
        required: false
        default: "10"
        type: string
      hop_interval:
        description: Hop interval for multi-hop upgrades (1→11→21)
        required: false
        default: "10"
        type: string
      include_prerelease_history:
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  generate-patches:
    name: All-history patches → ${{ inputs.target_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_TAG: ${{ inputs.target_tag }}
      SOURCE_REPO: ${{ github.repository }}
      MAX_FROM: ${{ inputs.max_from_versions }}
      HOP_INTERVAL: ${{ inputs.hop_interval }}
      INCLUDE_PRE: ${{ inputs.include_prerelease_history }}

    steps:
      - name: Checkout launcher (includes tools/pcl-n-patches)
        uses: actions/checkout@v4
        with:
          # Prefer the branch that carries the latest patch tooling (dev), not the
          # release tag commit, so workflow_dispatch re-runs pick up fixes.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for release assets to settle
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for release ${TARGET_TAG} assets on ${SOURCE_REPO}…"
          for i in $(seq 1 30); do
            count=$(gh api "repos/${SOURCE_REPO}/releases/tags/${TARGET_TAG}" --jq '.assets | length' 2>/dev/null || echo 0)
            echo "  attempt ${i}: assets=${count}"
            if [[ "${count}" -ge 1 ]]; then
              # Extra settle time so all matrix uploads finish (skipped if already settled)
              if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                echo "workflow_dispatch: assets already present (${count})"
                exit 0
              fi
              sleep 20
              count2=$(gh api "repos/${SOURCE_REPO}/releases/tags/${TARGET_TAG}" --jq '.assets | length')
              echo "  settled assets=${count2}"
              exit 0
            fi
            sleep 15
          done
          echo "Timed out waiting for release assets"
          exit 1

      - name: Bootstrap HDiffPatch
        working-directory: tools/pcl-n-patches
        run: python scripts/bootstrap_hdiffpatch.py

      - name: Generate patches (every prior version → target)
        working-directory: tools/pcl-n-patches
        run: |
          set -eo pipefail
          EXTRA=()
          if [[ "${INCLUDE_PRE}" == "true" ]]; then
            EXTRA+=(--include-prerelease-history)
          fi
          python scripts/generate_patches.py \
            --source-repo "${SOURCE_REPO}" \
            --target-tag "${TARGET_TAG}" \
            --out-dir "${{ github.workspace }}/patch-artifacts/${TARGET_TAG}" \
            --max-from-versions "${MAX_FROM:-10}" \
            --hop-interval "${HOP_INTERVAL:-10}" \
            --tools-dir "${{ github.workspace }}/tools/pcl-n-patches/tools/hdiffpatch" \
            ${EXTRA[@]+"${EXTRA[@]}"}

      - name: Summarize
        shell: bash
        run: |
          set -euo pipefail
          INDEX="${{ github.workspace }}/patch-artifacts/${TARGET_TAG}/index.json"
          if [[ ! -f "$INDEX" ]]; then
            echo "index.json missing"
            exit 1
          fi
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "patch-artifacts" / os.environ["TARGET_TAG"] / "index.json"
          data = json.loads(p.read_text(encoding="utf-8"))
          stats = data.get("stats") or {}
          print(f"target={data.get('targetTag')} patches={stats.get('patchesGenerated')} history={stats.get('historyVersions')}")
          variants = data.get("variants") or []
          print(f"variants_with_target={len(variants)}")
          for v in variants[:12]:
              print(f"  {v.get('runtimeId')}/{v.get('runtimeVariant')}: {len(v.get('patches') or [])} patches")
          if len(variants) > 12:
              print(f"  … {len(variants)-12} more variants")
          PY

      - name: Upload patches as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-patches-${{ inputs.target_tag }}
          path: patch-artifacts/${{ inputs.target_tag }}
          if-no-files-found: error
          retention-days: 30

      # Attach index + uniquely-named patches to the same launcher release.
      # Use `gh release upload` (not softprops) to avoid path-flattening name clashes.
      - name: Attach patches to launcher release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          ROOT="${{ github.workspace }}/patch-artifacts/${TARGET_TAG}"
          STAGE="${{ github.workspace }}/patch-upload-flat"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          cp -f "$ROOT/index.json" "$STAGE/patch-index.json"
          if [[ -d "$ROOT/manifests" ]]; then
            while IFS= read -r -d '' f; do
              base="$(basename "$f")"
              cp -f "$f" "$STAGE/patch-manifest-${base}"
            done < <(find "$ROOT/manifests" -type f -name '*.json' -print0)
          fi
          if [[ -d "$ROOT/patches" ]]; then
            # Filenames already include rid__variant__from-to.hdiff
            while IFS= read -r -d '' f; do
              cp -f "$f" "$STAGE/$(basename "$f")"
            done < <(find "$ROOT/patches" -type f \( -name '*.hdiff' -o -name '*.sha256' \) -print0)
          fi

          count="$(find "$STAGE" -type f | wc -l)"
          echo "Uploading ${count} patch artifacts to ${TARGET_TAG}"
          test "$count" -ge 1
          gh release upload "${TARGET_TAG}" "$STAGE"/* --clobber --repo "${SOURCE_REPO}"

      # Optional mirror to dedicated patches repo when PATCHES_REPO_TOKEN is configured.
      - name: Mirror to PCL-N-Patches repository
        continue-on-error: true
        env:
          MIRROR_TOKEN: ${{ secrets.PATCHES_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MIRROR_TOKEN:-}" ]]; then
            echo "PATCHES_REPO_TOKEN not set; skip mirror to dedicated patch repo."
            exit 0
          fi
          REPO="${{ vars.PATCHES_REPO || 'PCL-N-Edition/PCL-N-Patches' }}"
          TAG="patches-${TARGET_TAG}"
          ROOT="${{ github.workspace }}/patch-artifacts/${TARGET_TAG}"
          # Create release if missing, then upload assets with gh.
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "Patches to ${TARGET_TAG}" \
              --notes "Auto-generated by PCL-N release GA for **${TARGET_TAG}** (source: ${SOURCE_REPO})."
          fi
          # Upload index + all patch files (ignore empty globs)
          mapfile -t FILES < <(find "$ROOT" -type f \( -name 'index.json' -o -name '*.json' -o -name '*.hdiff' -o -name '*.sha256' \) | head -n 5000)
          if [[ "${#FILES[@]}" -eq 0 ]]; then
            echo "No patch files to mirror"
            exit 0
          fi
          GH_TOKEN="$MIRROR_TOKEN" gh release upload "$TAG" "${FILES[@]}" --repo "$REPO" --clobber

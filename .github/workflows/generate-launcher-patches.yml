name: Generate launcher patches

# Called after full launcher assets are on a GitHub Release.
# Builds HDiffPatch for the last N predecessors (+ hop anchors) → target tag.

on:
  workflow_call:
    inputs:
      target_tag:
        description: Release tag that was just published (e.g. v1.2.3)
        required: true
        type: string
      configuration:
        description: Release or Beta (asset name prefix PCL_N_<configuration>_…)
        required: true
        type: string
      max_from_versions:
        description: Direct patches from the last N versions (default 3)
        required: false
        type: number
        default: 3
      hop_interval:
        description: Multi-hop planning stride for clients (e.g. 1→4→7 when 3)
        required: false
        type: number
        default: 3
      include_prerelease_history:
        required: false
        type: boolean
        default: true
    secrets:
      # Optional: mirror patch release to a dedicated patches repository
      PATCHES_REPO_TOKEN:
        required: false
      GPG_PRIVATE_KEY:
        required: true
      GPG_PASSPHRASE:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
  # Re-run only the patch stage against an existing release (no full rebuild).
  workflow_dispatch:
    inputs:
      target_tag:
        description: Existing release tag to patch TO (e.g. v1.1.6-release)
        required: true
        type: string
      configuration:
        description: Release or Beta
        required: false
        default: Release
        type: choice
        options: [Release, Beta]
      max_from_versions:
        description: Direct patches from the last N versions
        required: false
        default: "3"
        type: string
      hop_interval:
        description: Hop interval for multi-hop upgrades (1→4→7)
        required: false
        default: "3"
        type: string
      include_prerelease_history:
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  generate-patches:
    name: All-history patches → ${{ inputs.target_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_TAG: ${{ inputs.target_tag }}
      SOURCE_REPO: ${{ github.repository }}
      MAX_FROM: ${{ inputs.max_from_versions }}
      HOP_INTERVAL: ${{ inputs.hop_interval }}
      INCLUDE_PRE: ${{ inputs.include_prerelease_history }}

    steps:
      - name: Checkout launcher (includes tools/pcl-n-patches)
        uses: actions/checkout@v4
        with:
          # Prefer the branch that carries the latest patch tooling (dev), not the
          # release tag commit, so workflow_dispatch re-runs pick up fixes.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Wait for release assets to settle
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for release ${TARGET_TAG} assets on ${SOURCE_REPO}…"
          for i in $(seq 1 30); do
            count=$(gh api "repos/${SOURCE_REPO}/releases/tags/${TARGET_TAG}" --jq '.assets | length' 2>/dev/null || echo 0)
            echo "  attempt ${i}: assets=${count}"
            if [[ "${count}" -ge 1 ]]; then
              # Extra settle time so all matrix uploads finish (skipped if already settled)
              if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                echo "workflow_dispatch: assets already present (${count})"
                exit 0
              fi
              sleep 20
              count2=$(gh api "repos/${SOURCE_REPO}/releases/tags/${TARGET_TAG}" --jq '.assets | length')
              echo "  settled assets=${count2}"
              exit 0
            fi
            sleep 15
          done
          echo "Timed out waiting for release assets"
          exit 1

      - name: Bootstrap HDiffPatch
        working-directory: tools/pcl-n-patches
        run: python scripts/bootstrap_hdiffpatch.py

      - name: Generate patches (recent predecessors → target)
        working-directory: tools/pcl-n-patches
        run: |
          set -eo pipefail
          EXTRA=()
          if [[ "${INCLUDE_PRE}" == "true" ]]; then
            EXTRA+=(--include-prerelease-history)
          fi
          python scripts/generate_patches.py \
            --source-repo "${SOURCE_REPO}" \
            --target-tag "${TARGET_TAG}" \
            --out-dir "${{ github.workspace }}/patch-artifacts/${TARGET_TAG}" \
            --max-from-versions "${MAX_FROM:-3}" \
            --hop-interval "${HOP_INTERVAL:-3}" \
            --max-patch-ratio 0.35 \
            --max-total-patch-ratio 0.50 \
            --max-history-age-days 14 \
            --tools-dir "${{ github.workspace }}/tools/pcl-n-patches/tools/hdiffpatch" \
            ${EXTRA[@]+"${EXTRA[@]}"}

      - name: Summarize
        shell: bash
        run: |
          set -euo pipefail
          INDEX="${{ github.workspace }}/patch-artifacts/${TARGET_TAG}/index.json"
          if [[ ! -f "$INDEX" ]]; then
            echo "index.json missing"
            exit 1
          fi
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "patch-artifacts" / os.environ["TARGET_TAG"] / "index.json"
          data = json.loads(p.read_text(encoding="utf-8"))
          stats = data.get("stats") or {}
          print(
              f"target={data.get('targetTag')} patches={stats.get('patchesGenerated')} "
              f"history={stats.get('historyVersionsSelected')}/{stats.get('historyVersionsAvailable')} "
              f"layout_skips={stats.get('incompatibleLayoutsSkipped', 0)} "
              f"size_skips={stats.get('inefficientPatchesSkipped', 0)} "
              f"budget_skips={stats.get('storageBudgetPatchesSkipped', 0)} "
              f"patch_bytes={stats.get('patchBytesPublished', 0)}"
          )
          variants = data.get("variants") or []
          print(f"variants_with_target={len(variants)}")
          for v in variants[:12]:
              print(f"  {v.get('runtimeId')}/{v.get('runtimeVariant')}: {len(v.get('patches') or [])} patches")
          if len(variants) > 12:
              print(f"  … {len(variants)-12} more variants")
          PY

      - name: Upload patches as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-patches-${{ inputs.target_tag }}
          path: patch-artifacts/${{ inputs.target_tag }}
          if-no-files-found: error
          retention-days: 30

      # Attach index + uniquely-named patches to the same launcher release.
      # Use `gh release upload` (not softprops) to avoid path-flattening name clashes.
      - name: Attach patches to launcher release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          ROOT="${{ github.workspace }}/patch-artifacts/${TARGET_TAG}"
          STAGE="${{ github.workspace }}/patch-upload-flat"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          cp -f "$ROOT/index.json" "$STAGE/patch-index.json"
          if [[ -d "$ROOT/manifests" ]]; then
            while IFS= read -r -d '' f; do
              base="$(basename "$f")"
              cp -f "$f" "$STAGE/patch-manifest-${base}"
            done < <(find "$ROOT/manifests" -type f -name '*.json' -print0)
          fi
          if [[ -d "$ROOT/patches" ]]; then
            # Filenames already include rid__variant__from-to.patch.zip.
            while IFS= read -r -d '' f; do
              cp -f "$f" "$STAGE/$(basename "$f")"
            done < <(find "$ROOT/patches" -type f -name '*.patch.zip' -print0)
          fi

          # The bundle signature anchors files.json and every per-file payload.
          # This is required because validating only the launcher entry would
          # not authenticate updated Host/native/sidecar files.
          while IFS= read -r -d '' asset; do
            gpg --detach-sign --armor "$asset"
          done < <(find "$STAGE" -maxdepth 1 -type f ! -name '*.asc' -print0)

          # `--clobber` only replaces equal names. Compute and delete old patch
          # objects that the new, smaller plan no longer references; otherwise
          # every regeneration leaks obsolete multi-gigabyte bundles.
          : > "${{ github.workspace }}/obsolete-patch-assets.txt"
          mapfile -t existing_assets < <(
            gh release view "${TARGET_TAG}" --repo "${SOURCE_REPO}" \
              --json assets --jq '.assets[].name'
          )
          for name in "${existing_assets[@]}"; do
            case "$name" in
              patch-index.json|patch-index.json.asc|index.json|index.json.asc|patch-manifest-*|*.patch.zip|*.patch.zip.asc|*.patch.zip.sha256|*.patch.zip.sha256.asc|*.hdiff|*.hdiff.sha256)
                if [[ ! -f "$STAGE/$name" ]]; then
                  printf '%s\n' "$name" >> "${{ github.workspace }}/obsolete-patch-assets.txt"
                fi
                ;;
            esac
          done

          count="$(find "$STAGE" -type f | wc -l)"
          echo "Uploading ${count} patch artifacts to ${TARGET_TAG}"
          test "$count" -ge 1
          gh release upload "${TARGET_TAG}" "$STAGE"/* --clobber --repo "${SOURCE_REPO}"

          while IFS= read -r name; do
            [[ -n "$name" ]] || continue
            echo "Deleting obsolete GitHub patch asset: $name"
            gh release delete-asset "${TARGET_TAG}" "$name" --yes --repo "${SOURCE_REPO}"
          done < "${{ github.workspace }}/obsolete-patch-assets.txt"

      - name: Mirror patch bundle to Cloudflare R2
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          STAGE="${{ github.workspace }}/patch-upload-flat"
          while IFS= read -r -d '' asset; do
            name="$(basename "$asset")"
            npx --yes wrangler@4.120.0 r2 object put \
              "pcln-releases/releases/${TARGET_TAG}/${name}" \
              --file "$asset" --remote
          done < <(find "$STAGE" -maxdepth 1 -type f -print0)

          while IFS= read -r name; do
            [[ -n "$name" ]] || continue
            echo "Deleting obsolete R2 patch object: $name"
            npx --yes wrangler@4.120.0 r2 object delete \
              "pcln-releases/releases/${TARGET_TAG}/${name}" --remote --force
          done < "${{ github.workspace }}/obsolete-patch-assets.txt"

      # Optional mirror to dedicated patches repo when PATCHES_REPO_TOKEN is configured.
      - name: Mirror to PCL-N-Patches repository
        continue-on-error: true
        env:
          MIRROR_TOKEN: ${{ secrets.PATCHES_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MIRROR_TOKEN:-}" ]]; then
            echo "PATCHES_REPO_TOKEN not set; skip mirror to dedicated patch repo."
            exit 0
          fi
          REPO="${{ vars.PATCHES_REPO || 'PCL-N-Edition/PCL-N-Patches' }}"
          TAG="patches-${TARGET_TAG}"
          STAGE="${{ github.workspace }}/patch-upload-flat"
          # Create release if missing, then upload assets with gh.
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "Patches to ${TARGET_TAG}" \
              --notes "Auto-generated by PCL-N release GA for **${TARGET_TAG}** (source: ${SOURCE_REPO})."
          fi
          # Upload index + all patch files (ignore empty globs)
          mapfile -t FILES < <(find "$STAGE" -maxdepth 1 -type f | head -n 5000)
          if [[ "${#FILES[@]}" -eq 0 ]]; then
            echo "No patch files to mirror"
            exit 0
          fi
          GH_TOKEN="$MIRROR_TOKEN" gh release upload "$TAG" "${FILES[@]}" --repo "$REPO" --clobber

name: Package and publish launcher assets

permissions:
  contents: write

on:
  workflow_call:
    inputs:
      configuration:
        description: Release or Beta
        required: true
        type: string
      channel:
        description: release or beta
        required: true
        type: string
      tag_name:
        required: true
        type: string
    secrets:
      GPG_PRIVATE_KEY:
        required: true
      GPG_PASSPHRASE:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

jobs:
  package-assets:
    strategy:
      fail-fast: false
      matrix:
        target:
          - { runner: windows-latest, runtime_id: win-x64, architecture: x64, platform: windows, binary_name: PCL-N-Edition.exe }
          - { runner: windows-latest, runtime_id: win-arm64, architecture: arm64, platform: windows, binary_name: PCL-N-Edition.exe }
          - { runner: ubuntu-latest, runtime_id: linux-x64, architecture: x64, platform: linux, binary_name: PCL-N-Edition, appimage_arch: x86_64 }
          - { runner: ubuntu-24.04-arm, runtime_id: linux-arm64, architecture: arm64, platform: linux, binary_name: PCL-N-Edition, appimage_arch: aarch64 }
          - { runner: macos-latest, runtime_id: osx-x64, architecture: x64, platform: macos, binary_name: PCL-N-Edition }
          - { runner: macos-latest, runtime_id: osx-arm64, architecture: arm64, platform: macos, binary_name: PCL-N-Edition }
        runtime_variant: [SelfContained, NoRuntime]
    runs-on: ${{ matrix.target.runner }}
    env:
      BASE_NAME: PCL_N_${{ inputs.configuration }}_${{ matrix.target.runtime_id }}_${{ matrix.runtime_variant }}
      ARTIFACT_NAME: PCL_N_${{ inputs.configuration }}_${{ matrix.target.runtime_id }}_${{ matrix.runtime_variant }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download launcher build
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact

      # Capture the replacement executable before packaging mutates / frees the tree.
      # macOS packaging moves the .app to save disk for hdiutil.
      - name: Preserve the raw launcher for binary signature compatibility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "signing/$BASE_NAME"
          binary="artifact/scatter/${{ matrix.target.binary_name }}"
          if [[ "${{ matrix.target.platform }}" == "macos" ]]; then
            binary="artifact/scatter/PCL N.app/Contents/MacOS/${{ matrix.target.binary_name }}"
          fi
          test -s "$binary"
          cp "$binary" "signing/$BASE_NAME/${{ matrix.target.binary_name }}"
          ls -la "signing/$BASE_NAME"

      - name: Free disk space (macOS packaging)
        if: ${{ matrix.target.platform == 'macos' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h
          # Packaging only needs the downloaded artifact + scripts; reclaim runner bloat.
          sudo rm -rf \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/dotnet \
            /usr/local/.ghcup \
            /Library/Developer/CoreSimulator \
            "$HOME/Library/Developer/CoreSimulator" \
            "$HOME/Library/Caches"/* 2>/dev/null || true
          echo "Disk after cleanup:"
          df -h

      - name: Install Windows packaging tools
        if: ${{ matrix.target.platform == 'windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install --global wix --version '6.*'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wix --version

      - name: Install Linux packaging tools
        if: ${{ matrix.target.platform == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm desktop-file-utils
          tool="$RUNNER_TEMP/appimagetool-${{ matrix.target.appimage_arch }}.AppImage"
          curl --fail --location --retry 4 \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.target.appimage_arch }}.AppImage" \
            --output "$tool"
          chmod +x "$tool"
          echo "APPIMAGETOOL=$tool" >> "$GITHUB_ENV"

      - name: Package Windows assets
        if: ${{ matrix.target.platform == 'windows' }}
        shell: pwsh
        run: |
          ./scripts/package-release-windows.ps1 `
            -ArtifactDirectory artifact/scatter `
            -PortableDirectory artifact/portable `
            -OutputDirectory package-output `
            -BaseName $env:BASE_NAME `
            -Version '${{ inputs.tag_name }}' `
            -Architecture '${{ matrix.target.architecture }}'

      - name: Package macOS assets
        if: ${{ matrix.target.platform == 'macos' }}
        shell: bash
        run: |
          chmod +x scripts/package-release-macos.sh
          scripts/package-release-macos.sh artifact/scatter package-output "$BASE_NAME"

      - name: Package Linux assets
        if: ${{ matrix.target.platform == 'linux' }}
        shell: bash
        run: |
          chmod +x scripts/package-release-linux.sh
          scripts/package-release-linux.sh \
            artifact/scatter package-output "$BASE_NAME" '${{ inputs.tag_name }}' '${{ matrix.target.architecture }}'

      - name: Validate packaged assets
        shell: bash
        run: |
          set -euo pipefail
          find package-output -maxdepth 1 -type f -print
          test -n "$(find package-output -maxdepth 1 -type f -print -quit)"
          if find package-output -type f \( -name '*.pdb' -o -name '*.dbg' \) -print -quit | grep -q .; then
            echo "::error::Debug symbols must not be distributed."
            exit 1
          fi
          # Ensure AppImages stay executable in the package artifact (mode may
          # still be lost after GitHub download — website documents chmod +x).
          while IFS= read -r -d '' appimage; do
            chmod a+x "$appimage"
            if [[ ! -x "$appimage" ]]; then
              echo "::error::AppImage is not executable: $appimage"
              ls -la "$appimage"
              exit 1
            fi
            echo "AppImage OK: $(basename "$appimage") mode=$(stat -c '%a' "$appimage" 2>/dev/null || stat -f '%Lp' "$appimage")"
          done < <(find package-output -maxdepth 1 -type f -name '*.AppImage' -print0)

      - name: Generate blockmaps and publish CAS (matrix-local)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: pcln-releases
        run: |
          set -euo pipefail
          chmod +x scripts/ci_matrix_cas_publish.sh
          scripts/ci_matrix_cas_publish.sh \
            package-output \
            '${{ inputs.tag_name }}' \
            '${{ inputs.configuration }}' \
            '${{ inputs.channel }}' \
            '${{ matrix.target.runtime_id }}' \
            '${{ matrix.runtime_variant }}' \
            block-dist \
            blockmap-stage

      - name: Upload packaged assets
        uses: actions/upload-artifact@v4
        with:
          name: PCL_N_Packages_${{ matrix.target.runtime_id }}_${{ matrix.runtime_variant }}
          path: |
            package-output
            signing
          if-no-files-found: error

      - name: Upload blockmap manifests (for central sign/promote)
        uses: actions/upload-artifact@v4
        with:
          name: PCL_N_Blockmaps_${{ matrix.target.runtime_id }}_${{ matrix.runtime_variant }}
          path: blockmap-stage
          if-no-files-found: error

  publish-assets:
    permissions:
      contents: write
    needs: [package-assets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all packaged assets
        uses: actions/download-artifact@v4
        with:
          pattern: PCL_N_Packages_*
          path: packaged
          merge-multiple: true

      - name: Download matrix blockmap manifests
        uses: actions/download-artifact@v4
        with:
          pattern: PCL_N_Blockmaps_*
          path: blockmaps
          merge-multiple: true

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign packages and write update compatibility metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p dist/updates dist/downloads block-dist/manifests

          # Keep updater scatter archives physically separate from user-facing
          # installers and single-file portable packages. Since 1.4.3, updater
          # assets are Cloudflare-only; GitHub receives dist/downloads only.
          while IFS= read -r -d '' asset; do
            name="$(basename "$asset")"
            if [[ "$name" =~ ^PCL_N_(Release|Beta)_(win|linux|osx)-(x64|arm64)_(SelfContained|NoRuntime)\.(zip|tar\.gz)$ ]]; then
              destination="dist/updates/$name"
            else
              destination="dist/downloads/$name"
            fi
            cp -a "$asset" "$destination"
          done < <(find packaged/package-output -maxdepth 1 -type f -print0)
          chmod a+x dist/downloads/*.AppImage 2>/dev/null || true

          # Protocol v2 §15–16: matrix runners already chunked + uploaded CAS.
          # Central job only collects signed maps for promote (no full re-chunk).
          map_count=0
          if [[ -d blockmaps ]]; then
            while IFS= read -r -d '' map; do
              cp -a "$map" block-dist/manifests/
              cp -a "$map" dist/updates/
              map_count=$((map_count + 1))
            done < <(find blockmaps -type f \( -name '*.blockmap.json' -o -name '*.blockmap.v2.json' \) -print0)
          fi
          echo "Collected $map_count matrix blockmap manifest(s)."

          # Fallback: regenerate if a matrix job failed to stage maps (should be rare).
          if [[ "$map_count" -eq 0 ]]; then
            echo "::warning::No matrix blockmaps found; regenerating centrally (slow path)."
            while IFS= read -r -d '' archive; do
              name="$(basename "$archive")"
              if [[ ! "$name" =~ ^PCL_N_(Release|Beta)_((win|linux|osx)-(x64|arm64))_(SelfContained|NoRuntime)\.(zip|tar\.gz)$ ]]; then
                echo "::error::Cannot derive block-map identity from $name"
                exit 1
              fi
              python scripts/generate_update_blockmap.py \
                --archive "$archive" \
                --output block-dist \
                --target-tag "$RELEASE_TAG" \
                --target-version "${RELEASE_TAG#v}" \
                --runtime-id "${BASH_REMATCH[2]}" \
                --runtime-variant "${BASH_REMATCH[5]}" \
                --configuration "${BASH_REMATCH[1]}" \
                --profile auto
            done < <(find dist/updates -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0)

            while IFS= read -r -d '' portable; do
              name="$(basename "$portable")"
              if [[ ! "$name" =~ ^PCL_N_(Release|Beta)_((win)-(x64|arm64))_(SelfContained|NoRuntime)_Portable\.exe$ ]]; then
                echo "::error::Cannot derive portable block-map identity from $name"
                exit 1
              fi
              python scripts/generate_update_blockmap.py \
                --file "$portable" \
                --target-asset-name "$name" \
                --entry-name PCL-N-Edition.exe \
                --output block-dist \
                --target-tag "$RELEASE_TAG" \
                --target-version "${RELEASE_TAG#v}" \
                --runtime-id "${BASH_REMATCH[2]}" \
                --runtime-variant "${BASH_REMATCH[5]}" \
                --configuration "${BASH_REMATCH[1]}" \
                --profile auto
            done < <(find dist/downloads -maxdepth 1 -type f -name '*_Portable.exe' -print0)
            find block-dist/manifests -maxdepth 1 -type f \( -name '*.blockmap.json' -o -name '*.blockmap.v2.json' \) -exec cp -a {} dist/updates/ \;
          fi

          # Every user-selectable installer and portable package gets its own
          # detached signature. No package is modified after this point.
          while IFS= read -r -d '' asset; do
            gpg --detach-sign --armor "$asset"
          done < <(find dist -mindepth 2 -maxdepth 2 -type f ! -name '*.asc' -print0)

          # Existing launchers expect a signature over the final replacement
          # executable next to the unchanged canonical zip/tar.gz package.
          while IFS= read -r -d '' binary; do
            base="$(basename "$(dirname "$binary")")"
            if [[ "$base" == *'_win-'* ]]; then
              canonical="dist/updates/${base}.zip"
            else
              canonical="dist/updates/${base}.tar.gz"
            fi
            test -s "$canonical"
            gpg --detach-sign --armor --output "${canonical}.binary.asc" "$binary"
            jq -n \
              --arg channel "${{ inputs.configuration }}" \
              --arg commit "$GITHUB_SHA" \
              --arg ref "$GITHUB_REF" \
              --arg tag "$RELEASE_TAG" \
              --arg runId "$GITHUB_RUN_ID" \
              --arg artifact "$base" \
              --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{formatVersion: 1, channel: $channel, commit: $commit, ref: $ref, tag: $tag, runId: $runId, artifact: $artifact, builtAt: $builtAt}' \
              > "dist/updates/${base}.build.json"
          done < <(find packaged/signing -mindepth 2 -maxdepth 2 -type f -print0)

          # Canonical updater archives are only temporary block-generation
          # inputs. R2 receives compact metadata/signatures and global blocks;
          # it never stores another copy of the complete scatter archive.
          rm -rf dist/r2-updates
          mkdir -p dist/r2-updates
          while IFS= read -r -d '' asset; do
            name="$(basename "$asset")"
            if [[ "$name" =~ \.blockmap(\.v2)?\.json(\.asc)?$ ||
                  "$name" =~ \.build\.json$ ||
                  "$name" =~ \.(zip|tar\.gz)\.binary\.asc$ ]]; then
              cp -a "$asset" "dist/r2-updates/$name"
            fi
          done < <(find dist/updates -maxdepth 1 -type f -print0)
          find dist/downloads -maxdepth 1 -type f -name '*_Portable.exe.asc' -exec cp -a {} dist/r2-updates/ \;
          test -n "$(find dist/r2-updates -maxdepth 1 -type f \( -name '*.blockmap.json' -o -name '*.blockmap.v2.json' \) -print -quit)"
          if find dist/r2-updates -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print -quit | grep -q .; then
            echo "::error::Canonical updater archive leaked into R2 staging"
            exit 1
          fi

          echo "Updater assets:"
          find dist/r2-updates -maxdepth 1 -type f -printf '  %f\n' | (sort || true)
          echo "Download assets:"
          find dist/downloads -maxdepth 1 -type f -printf '  %f\n' | (sort || true)

          mkdir -p channel-dist
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg version "${RELEASE_TAG#v}" \
            --arg channel '${{ inputs.channel }}' \
            --arg commitSha "$GITHUB_SHA" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg manifestKey "releases/${RELEASE_TAG}" \
            '{formatVersion: 1, tag: $tag, version: $version, channel: $channel, commitSha: $commitSha, publishedAt: $publishedAt, manifestKey: $manifestKey}' \
            > "channel-dist/${{ inputs.channel }}.json"

      - name: Upload remaining CAS objects to Cloudflare R2
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: pcln-releases
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          # Matrix jobs already uploaded CAS; this is an idempotent catch-up
          # (List inventory skip / If-None-Match) for any leftover objects from the
          # central fallback re-chunk path.
          if [[ -d block-dist/block || -d block-dist/delta ]]; then
            python scripts/upload_r2_cas.py upload-tree block-dist \
              --prefix block --prefix delta \
              --concurrency 24
          else
            echo "No central block-dist CAS tree (matrix already published); skipping."
          fi

      - name: Validate blockmaps and remote CAS (before promote)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: pcln-releases
        run: |
          set -euo pipefail
          python -m pip install --quiet 'zstandard>=0.22' || true
          # Protocol v2 §16: Validate → then publish maps / channel pointer.
          python scripts/validate_update_release.py \
            --manifest-dir block-dist/manifests \
            --local-root block-dist \
            --require-remote

      - name: Upload user download assets to the existing GitHub release
        uses: softprops/action-gh-release@v2.5.0
        with:
          tag_name: ${{ inputs.tag_name }}
          files: dist/downloads/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish updater assets and channel marker to Cloudflare R2
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: pcln-releases
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }

          while IFS= read -r -d '' asset; do
            name="$(basename "$asset")"
            if [[ ! "$name" =~ ^PCL_N_(Release|Beta)_(win|linux|osx)-(x64|arm64)_(SelfContained|NoRuntime)\.(zip|tar\.gz)\.binary\.asc$ &&
                  ! "$name" =~ ^PCL_N_(Release|Beta)_(win|linux|osx)-(x64|arm64)_(SelfContained|NoRuntime)\.(build|blockmap(\.v2)?)\.json(\.asc)?$ &&
                  ! "$name" =~ ^PCL_N_(Release|Beta)_win-(x64|arm64)_(SelfContained|NoRuntime)_Portable\.(exe\.asc|blockmap(\.v2)?\.json(\.asc)?)$ ]]; then
              echo "::error::Unexpected file in updater staging directory: $name"
              exit 1
            fi
          done < <(find dist/r2-updates -maxdepth 1 -type f -print0)

          python scripts/upload_r2_cas.py put-files dist/r2-updates \
            --key-prefix "releases/${RELEASE_TAG}" \
            --concurrency 16

          # Remove canonical archives written by an earlier version of this
          # workflow. The operation is idempotent and limited to this tag.
          : > obsolete-archives.txt
          while IFS= read -r -d '' archive; do
            name="$(basename "$archive")"
            printf 'releases/%s/%s\nreleases/%s/%s.asc\n' \
              "$RELEASE_TAG" "$name" "$RELEASE_TAG" "$name" >> obsolete-archives.txt
          done < <(find dist/updates -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0)
          if [[ -s obsolete-archives.txt ]]; then
            python scripts/upload_r2_cas.py delete-list obsolete-archives.txt --concurrency 8 || true
          fi

          # Mark-and-sweep only objects recorded in our catalog. Shared blocks
          # stay alive while any release inside the 14-day rollback window uses them.
          rm -f block-catalog.previous.json block-catalog.next.json obsolete-r2-objects.txt remote-cas-keys.txt
          python scripts/upload_r2_cas.py get block/catalog.json \
            --file block-catalog.previous.json || rm -f block-catalog.previous.json
          # Protocol v2 §19: inventory mark-and-sweep for unreferenced block/ + delta/.
          python scripts/upload_r2_cas.py list block/ > remote-cas-keys.txt || true
          python scripts/upload_r2_cas.py list delta/ >> remote-cas-keys.txt || true
          python scripts/update_update_block_catalog.py \
            --catalog block-catalog.previous.json \
            --manifest-dir block-dist/manifests \
            --asset-dir dist/r2-updates \
            --tag "$RELEASE_TAG" \
            --channel '${{ inputs.channel }}' \
            --published-at "$(jq -r .publishedAt 'channel-dist/${{ inputs.channel }}.json')" \
            --output block-catalog.next.json \
            --delete-list obsolete-r2-objects.txt \
            --remote-keys remote-cas-keys.txt
          if [[ -s obsolete-r2-objects.txt ]]; then
            python scripts/upload_r2_cas.py delete-list obsolete-r2-objects.txt --concurrency 16
          fi
          python scripts/upload_r2_cas.py put block/catalog.json \
            --file block-catalog.next.json

          # Publish the channel pointer last: clients can only discover this
          # version after every signed map, block and binary signature exists.
          python scripts/upload_r2_cas.py put \
            "channels/${{ inputs.channel }}.json" \
            --file "channel-dist/${{ inputs.channel }}.json"

      - name: Publish Cloudflare website download catalog
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: pcln-releases
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          catalog="$RUNNER_TEMP/launcher-releases.json"
          python scripts/upload_r2_cas.py get website/launcher-releases.json \
            --file "$catalog" || printf '{"schemaVersion":1,"versions":[]}\n' > "$catalog"

          python scripts/update_download_catalog.py \
            --file "$catalog" \
            --tag "$RELEASE_TAG" \
            --channel '${{ inputs.channel }}' \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python scripts/upload_r2_cas.py put website/launcher-releases.json \
            --file "$catalog" \
            --content-type "application/json; charset=utf-8"

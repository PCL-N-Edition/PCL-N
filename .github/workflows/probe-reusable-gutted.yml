name: Token probe reusable (gutted real)

permissions:
  contents: write

on:
  workflow_call:
    inputs:
      tag_name:
        description: Release tag to PATCH (no-op body update)
        required: true
        type: string
    secrets:
      GPG_PRIVATE_KEY:
        required: true
      GPG_PASSPHRASE:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

jobs:
  publish-assets:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Replicate the gh-release action PATCH payload via gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_id=378414427
          body="$(gh api "repos/PCL-N-Edition/PCL-N/releases/$release_id" --jq .body)"
          payload="$(jq -n \
            --arg tag_name "v1.4.12-beta" \
            --arg target_commitish "190a53a4724f229db6541c7e5c03f35df2a6d301" \
            --arg name "PCL N v1.4.12 Beta" \
            --arg body "$body" \
            --argjson draft false \
            --argjson prerelease true \
            '{tag_name:$tag_name, target_commitish:$target_commitish, name:$name, body:$body, draft:$draft, prerelease:$prerelease}')"
          echo "PATCH payload:"
          echo "$payload" | jq -c .
          if gh api -X PATCH "repos/PCL-N-Edition/PCL-N/releases/$release_id" --input - <<<"$payload" --jq .id >/dev/null 2>&1; then
            echo "FULL-PAYLOAD-PATCH-OK"
          else
            echo "FULL-PAYLOAD-PATCH-403"
          fi

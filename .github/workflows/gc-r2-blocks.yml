name: GC unused R2 CAS blocks

# Standalone mark-and-sweep for content-addressed updater blocks/deltas.
# Default is dry-run; set apply=true to delete unreachable keys.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Actually delete unreachable keys (false = dry-run)
        required: true
        type: boolean
        default: false
      concurrency:
        description: Delete concurrency
        required: false
        type: number
        default: 16

concurrency:
  group: release-publish-cloudflare
  cancel-in-progress: false

jobs:
  gc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run R2 CAS GC
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: pcln-releases
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }

          args=(gc --concurrency "${{ inputs.concurrency }}" --delete-list obsolete-r2-objects.txt --catalog-out block-catalog.pruned.json)
          if [[ "${{ inputs.apply }}" == "true" ]]; then
            args+=(--apply)
            echo "Mode: APPLY (will delete unreachable keys)"
          else
            echo "Mode: DRY-RUN"
          fi

          python scripts/upload_r2_cas.py "${args[@]}"

          if [[ -f obsolete-r2-objects.txt ]]; then
            echo "Delete list lines: $(wc -l < obsolete-r2-objects.txt)"
            head -n 50 obsolete-r2-objects.txt || true
          fi

      - name: Upload GC artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-cas-gc
          path: |
            obsolete-r2-objects.txt
            block-catalog.pruned.json
          if-no-files-found: ignore
          retention-days: 14

name: Build Avalonia Desktop (Reusable)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      configuration:
        required: true
        type: string
      runner:
        required: true
        type: string
      runtime_id:
        required: true
        type: string
      architecture:
        required: true
        type: string
      binary_name:
        required: true
        type: string
      self_contained:
        required: true
        type: boolean
      runtime_variant:
        required: true
        type: string
      # Embed CoreCLR plugin sidecar zip into the host single-file binary (opaque payload; not in-process IL).
      # Extracted at runtime into the launcher data/config directory.
      embed_plugin_sidecar:
        required: false
        default: true
        type: boolean
      # Legacy alias kept for older callers; prefer embed_plugin_sidecar.
      include_plugin:
        required: false
        default: false
        type: boolean
      plugin_tag:
        description: PCL.Plugin source tag for sidecar build (empty = Latest channel / newest v* tag)
        required: false
        default: ""
        type: string
      require_ms_client_id:
        description: Fail the build when Microsoft OAuth CLIENT_ID secret is missing
        required: false
        default: true
        type: boolean
      # Channel stamped into embedded metadata.json (release | beta | ci).
      # Empty = derive from configuration (Release→release, Beta→beta, CI→ci).
      channel:
        required: false
        default: ""
        type: string
      # Optional release tag (e.g. v1.1.6-release) to fill version.base / consistency checks.
      version_tag:
        required: false
        default: ""
        type: string
    secrets:
      # Prefer CLIENT_ID (legacy name). MS_CLIENT_ID / PCL_MS_CLIENT_ID are accepted aliases.
      CLIENT_ID:
        required: false
      MS_CLIENT_ID:
        required: false
      PCL_MS_CLIENT_ID:
        required: false
      LITTLESKIN_CLIENT_ID:
        required: false
      LITTLESKIN_CLIENT_SECRET:
        required: false
      LITTLESKIN_REDIRECT_URI:
        required: false
      CURSEFORGE_API_KEY:
        required: false
      SENTRY_DSN:
        required: false
      NAID_CLIENT_ID:
        required: false
      NAID_CLIENT_SECRET:
        required: false
      LINK_SERVER_ROOTS:
        required: false
      LOBBY_DEFAULT_SECRET:
        required: false
jobs:
  build:
    name: ${{ inputs.runtime_id }} / ${{ inputs.runtime_variant }}
    runs-on: ${{ inputs.runner }}
    env:
      LANG: en_US.UTF-8
      PUBLISH_DIR: artifact
      ARTIFACT_NAME: PCL_N_${{ inputs.configuration }}_${{ inputs.runtime_id }}_${{ inputs.runtime_variant }}
      # Stabilize MSBuild node crashes (MSB4166) on constrained runners.
      DOTNET_CLI_UI_LANGUAGE: en
      MSBUILDDISABLENODEREUSE: 1

    steps:
      - name: Checkout Avalonia branch
        uses: actions/checkout@v6
        with:
          # Desktop ProjectReference → external/Jvm.NET; empty submodule dir fails the graph.
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # PCL.Plugin and its SDK are public release inputs. Keep this path independent
      # from repository PATs so publishing cannot fail when an optional token expires.
      - name: Plan plugin sidecar embed
        id: plugin_plan
        shell: bash
        env:
          WANT_EMBED: ${{ inputs.embed_plugin_sidecar || inputs.include_plugin }}
        run: |
          set -euo pipefail
          if [[ "${WANT_EMBED}" != "true" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Plugin embed disabled for this job."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "Plugin embed enabled from public source tags."

      - name: Checkout PCL-N-Plugin-SDK (sidecar build)
        if: ${{ steps.plugin_plan.outputs.enabled == 'true' }}
        shell: bash
        run: >-
          git clone --depth 1
          https://github.com/PCL-N-Edition/PCL-N-Plugin-SDK.git
          PCL-N-Plugin-SDK

      - name: Checkout PCL.Plugin source
        if: ${{ steps.plugin_plan.outputs.enabled == 'true' }}
        id: plugin_checkout
        continue-on-error: ${{ inputs.channel == 'ci' || inputs.channel == 'dev' || inputs.channel == '' }}
        shell: bash
        run: >-
          git clone --filter=blob:none
          https://github.com/PCL-N-Edition/PCL.Plugin.git
          PCL.Plugin

      - name: Pin PCL.Plugin to Latest release tag
        if: ${{ steps.plugin_plan.outputs.enabled == 'true' && steps.plugin_checkout.conclusion == 'success' }}
        id: plugin_ref
        continue-on-error: ${{ inputs.channel == 'ci' || inputs.channel == 'dev' || inputs.channel == '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pluginRoot = Join-Path $env:GITHUB_WORKSPACE 'PCL.Plugin'
          if (-not (Test-Path -LiteralPath (Join-Path $pluginRoot 'PCL.Plugin.csproj'))) {
            throw "Public PCL.Plugin checkout is missing PCL.Plugin.csproj."
          }

          $tag = '${{ inputs.plugin_tag }}'.Trim()
          if (-not $tag) {
            & git -C $pluginRoot fetch --tags --force origin 2>$null | Out-Null
            $names = @(& git -C $pluginRoot tag -l 'v*')
            if ($names.Count -eq 0) {
              throw "No v* tags in PCL.Plugin checkout. Pass plugin_tag input or publish a plugin release tag."
            }
            $tag = @(
              $names | Sort-Object {
                $t = $_ -replace '^v', '' -replace '-.*$', ''
                try { [version]$t } catch { [version]'0.0.0' }
              } -Descending
            ) | Select-Object -First 1
            Write-Host "Resolved plugin tag via git tags: $tag"
          }

          & git -C $pluginRoot checkout --force $tag
          if ($LASTEXITCODE -ne 0) { throw "git checkout $tag failed in PCL.Plugin" }
          & git -C $pluginRoot reset --hard $tag
          if ($LASTEXITCODE -ne 0) { throw "git reset --hard $tag failed in PCL.Plugin" }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Pinned PCL.Plugin @ $tag"

      - name: Pack plugin sidecar zip for host embed
        if: ${{ steps.plugin_plan.outputs.enabled == 'true' && steps.plugin_ref.conclusion == 'success' }}
        id: sidecar_zip
        continue-on-error: ${{ inputs.channel == 'ci' || inputs.channel == 'dev' || inputs.channel == '' }}
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE "artifacts/PCL.Plugin.Sidecar.${{ inputs.runtime_id }}.zip"
          & ./scripts/pack-plugin-sidecar-zip.ps1 `
            -Configuration '${{ inputs.configuration }}' `
            -Runtime '${{ inputs.runtime_id }}' `
            -OutputZip $zip `
            -SkipFetch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath $zip)) { throw "Sidecar zip missing: $zip" }
          "path=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Sidecar zip ready: $zip (plugin ${{ steps.plugin_ref.outputs.tag }})"

      - name: Require plugin embed for non-CI channels
        if: ${{ (inputs.embed_plugin_sidecar || inputs.include_plugin) && inputs.channel != 'ci' && inputs.channel != 'dev' && inputs.channel != '' && steps.sidecar_zip.outputs.path == '' }}
        shell: bash
        run: |
          echo "::error::Failed to embed PCL.Plugin sidecar for channel=${{ inputs.channel }}."
          echo "Ensure the public PCL.Plugin and SDK repositories are reachable and that a v* plugin tag exists."
          exit 1

      - name: Resolve Microsoft Client ID secret
        id: ms_client
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          PCL_MS_CLIENT_ID: ${{ secrets.PCL_MS_CLIENT_ID }}
        run: |
          set -euo pipefail
          value=""
          if [[ -n "${PCL_MS_CLIENT_ID:-}" ]]; then
            value="$PCL_MS_CLIENT_ID"
          elif [[ -n "${MS_CLIENT_ID:-}" ]]; then
            value="$MS_CLIENT_ID"
          elif [[ -n "${CLIENT_ID:-}" ]]; then
            value="$CLIENT_ID"
          fi
          echo "has_value=$([[ -n "$value" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # Mask and export for later steps (do not print value).
          if [[ -n "$value" ]]; then
            echo "::add-mask::$value"
            echo "PCL_MS_CLIENT_ID=$value" >> "$GITHUB_ENV"
          fi

      - name: Require Microsoft Client ID for publish builds
        if: ${{ inputs.require_ms_client_id }}
        shell: bash
        run: |
          if [[ "${{ steps.ms_client.outputs.has_value }}" != "true" ]]; then
            echo "::error::Missing Microsoft OAuth client id secret."
            echo "Add a repository secret named CLIENT_ID (or MS_CLIENT_ID / PCL_MS_CLIENT_ID)."
            echo "It is embedded into the binary at publish time via PCL_WRITE_SECRET."
            exit 1
          fi
          echo "Microsoft CLIENT_ID secret is present (value masked)."

      - name: Stamp build metadata (channel / version / commit)
        id: stamp
        shell: bash
        env:
          PCL_GITHUB_SHA: ${{ github.sha }}
        run: |
          set -eo pipefail
          cfg="${{ inputs.configuration }}"
          channel="${{ inputs.channel }}"
          if [[ -z "${channel}" ]]; then
            case "${cfg,,}" in
              release|stable) channel=release ;;
              beta) channel=beta ;;
              ci|dev) channel=ci ;;
              *) channel=ci ;;
            esac
          fi
          tag="${{ inputs.version_tag }}"
          extra=()
          if [[ -n "${tag}" ]]; then
            extra+=(--tag "${tag}")
          fi
          # Windows runners often only expose `python`, not `python3`.
          if command -v python3 >/dev/null 2>&1; then
            PY=python3
          else
            PY=python
          fi
          "$PY" scripts/stamp_build_metadata.py \
            --metadata PCL.Desktop/metadata.json \
            --channel "${channel}" \
            --sha "${PCL_GITHUB_SHA}" \
            --github-output \
            ${extra[@]+"${extra[@]}"}
          echo "Stamped metadata:"
          cat PCL.Desktop/metadata.json

      - name: Bootstrap launcher patch client
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" tools/pcl-n-patches/scripts/bootstrap_hdiffpatch.py \
            --tools-dir "${{ github.workspace }}/update-tools"
          if [[ -f "${{ github.workspace }}/update-tools/hpatchz.exe" ]]; then
            tool="${{ github.workspace }}/update-tools/hpatchz.exe"
          else
            tool="${{ github.workspace }}/update-tools/hpatchz"
          fi
          test -s "$tool"
          echo "PCL_HPATCHZ_PATH=$tool" >> "$GITHUB_ENV"

      - name: Publish Avalonia desktop
        shell: bash
        env:
          PCL_WRITE_SECRET: '1'
          # Prefer env written by Resolve step; fall back to raw secrets for other keys.
          PCL_MS_CLIENT_ID: ${{ env.PCL_MS_CLIENT_ID }}
          PCL_LITTLESKIN_CLIENT_ID: ${{ secrets.LITTLESKIN_CLIENT_ID }}
          PCL_LITTLESKIN_CLIENT_SECRET: ${{ secrets.LITTLESKIN_CLIENT_SECRET }}
          PCL_LITTLESKIN_REDIRECT_URI: ${{ secrets.LITTLESKIN_REDIRECT_URI }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          PCL_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          PCL_NAID_CLIENT_ID: ${{ secrets.NAID_CLIENT_ID }}
          PCL_NAID_CLIENT_SECRET: ${{ secrets.NAID_CLIENT_SECRET }}
          PCL_LINK_SERVER_ROOT: ${{ secrets.LINK_SERVER_ROOTS }}
          PCL_LOBBY_DEFAULT_SECRET: ${{ secrets.LOBBY_DEFAULT_SECRET }}
          PCL_GITHUB_SHA: ${{ github.sha }}
        run: |
          set -eo pipefail

          version_args=()
          if [[ -n "${PCL_STAMPED_ASSEMBLY_VERSION:-}" ]]; then
            version_args+=(-p:Version="${PCL_STAMPED_ASSEMBLY_VERSION}")
          fi
          if [[ -n "${PCL_STAMPED_INFORMATIONAL_VERSION:-}" ]]; then
            version_args+=(-p:InformationalVersion="${PCL_STAMPED_INFORMATIONAL_VERSION}")
          fi

          # Single-node publish reduces MSB4166 crashes.
          # NETSDK1176: EnableCompressionInSingleFile is only valid for self-contained.
          # Host stays free of in-process plugin IL; optional opaque sidecar zip is embedded.
          sidecar_zip="${{ steps.sidecar_zip.outputs.path }}"
          sidecar_args=()
          if [[ -n "${sidecar_zip}" && -f "${sidecar_zip}" ]]; then
            sidecar_args+=(-p:PclPluginSidecarZipPath="${sidecar_zip}")
            echo "Embedding plugin sidecar zip: ${sidecar_zip}"
          else
            echo "No plugin sidecar zip — host will run without embedded plugins."
          fi

          dotnet publish PCL.Desktop/PCL.Desktop.csproj \
            -c "${{ inputs.configuration }}" \
            -r "${{ inputs.runtime_id }}" \
            --self-contained "${{ inputs.self_contained }}" \
            -m:1 \
            -nodeReuse:false \
            -p:Platform="${{ inputs.architecture }}" \
            -p:PublishAot=false \
            -p:PublishTrimmed=false \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile="${{ inputs.self_contained }}" \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PclRuntimeVariant="${{ inputs.runtime_variant }}" \
            -p:PclHpatchzPath="$PCL_HPATCHZ_PATH" \
            -p:PclWriteSecret=1 \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:DeleteExistingFiles=true \
            ${sidecar_args[@]+"${sidecar_args[@]}"} \
            ${version_args[@]+"${version_args[@]}"} \
            -warnaserror:CA1416 \
            -o "$PUBLISH_DIR"

      - name: Validate Avalonia artifact
        shell: bash
        run: |
          binary="$PUBLISH_DIR/${{ inputs.binary_name }}"
          test -s "$binary" || {
            echo "::error file=$binary::Published Avalonia launcher executable is missing."
            exit 1
          }

          find "$PUBLISH_DIR" -type f \( -name '*.pdb' -o -name '*.xml' -o -name '*.dbg' \) -delete
          file_count=$(find "$PUBLISH_DIR" -maxdepth 1 -type f | wc -l | tr -d ' ')
          if [[ "$file_count" != "1" ]]; then
            echo "::error::Expected one portable Avalonia binary, found $file_count files."
            find "$PUBLISH_DIR" -maxdepth 2 -print
            exit 1
          fi

          chmod +x "$binary" || true

          # Smoke-check embedded secrets when CLIENT_ID was required.
          # Only execute the binary when RID matches this runner (win-arm64 on windows-latest x64
          # fails with "cannot execute binary file: Exec format error").
          if [[ "${{ inputs.require_ms_client_id }}" == "true" ]]; then
            rid="${{ inputs.runtime_id }}"
            need_os=""
            need_arch=""
            case "$rid" in
              win-x64) need_os=Windows; need_arch=X64 ;;
              win-arm64) need_os=Windows; need_arch=ARM64 ;;
              linux-x64) need_os=Linux; need_arch=X64 ;;
              linux-arm64) need_os=Linux; need_arch=ARM64 ;;
              osx-x64) need_os=macOS; need_arch=X64 ;;
              osx-arm64) need_os=macOS; need_arch=ARM64 ;;
            esac

            can_execute=false
            if [[ -n "$need_os" && -n "$need_arch" &&
                  "${{ runner.os }}" == "$need_os" &&
                  "${{ runner.arch }}" == "$need_arch" ]]; then
              can_execute=true
            fi

            if [[ "$can_execute" == "true" ]]; then
              if ! "$binary" --validate-secrets; then
                echo "::error::Published binary is missing embedded secrets (PCL_WRITE_SECRET / CLIENT_ID)."
                exit 1
              fi
              echo "Embedded secrets validation passed (native execute)."
            else
              echo "Skipping native --validate-secrets for cross-arch RID '$rid' on ${{ runner.os }}/${{ runner.arch }}."
              echo "Secret presence was already enforced at build time (require_ms_client_id + PCL_WRITE_SECRET)."
            fi
          fi

      - name: Create macOS application bundle
        if: ${{ startsWith(inputs.runtime_id, 'osx-') }}
        shell: bash
        run: |
          set -euo pipefail
          app="$PUBLISH_DIR/PCL N.app"
          contents="$app/Contents"
          executable="$contents/MacOS/${{ inputs.binary_name }}"
          resources="$contents/Resources"
          iconset="$RUNNER_TEMP/PCL-N.iconset"
          plist="$contents/Info.plist"

          mkdir -p "$contents/MacOS" "$resources" "$iconset"
          mv "$PUBLISH_DIR/${{ inputs.binary_name }}" "$executable"
          chmod +x "$executable"

          for size in 16 32 128 256 512; do
            double=$((size * 2))
            sips -z "$size" "$size" PCL.Desktop/Assets/icon.png \
              --out "$iconset/icon_${size}x${size}.png" >/dev/null
            sips -z "$double" "$double" PCL.Desktop/Assets/icon.png \
              --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$resources/PCL-N.icns"

          version="${PCL_STAMPED_ASSEMBLY_VERSION:-1.0.0}"
          short_version="${version%%-*}"
          bundle_version="$(printf '%s' "$version" | sed -E 's/[^0-9.].*$//; s/\.$//')"
          bundle_version="${bundle_version:-1.0.0}"
          plutil -create xml1 "$plist"
          plutil -insert CFBundleDevelopmentRegion -string en "$plist"
          plutil -insert CFBundleDisplayName -string 'PCL N' "$plist"
          plutil -insert CFBundleExecutable -string '${{ inputs.binary_name }}' "$plist"
          plutil -insert CFBundleIconFile -string PCL-N "$plist"
          plutil -insert CFBundleIdentifier -string io.github.pcl-n-edition.pcl-n "$plist"
          plutil -insert CFBundleInfoDictionaryVersion -string '6.0' "$plist"
          plutil -insert CFBundleName -string 'PCL N' "$plist"
          plutil -insert CFBundlePackageType -string APPL "$plist"
          plutil -insert CFBundleShortVersionString -string "$short_version" "$plist"
          plutil -insert CFBundleVersion -string "$bundle_version" "$plist"
          plutil -insert LSMinimumSystemVersion -string '12.0' "$plist"
          plutil -insert NSHighResolutionCapable -bool true "$plist"

          codesign --force --deep --sign - "$app"
          plutil -lint "$plist"
          codesign --verify --deep --strict "$app"
          test -x "$executable"

      - name: Upload Avalonia build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact
          if-no-files-found: error

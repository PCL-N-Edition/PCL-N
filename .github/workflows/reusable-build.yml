name: Build Avalonia Desktop (Reusable)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      configuration:
        required: true
        type: string
      runner:
        required: true
        type: string
      runtime_id:
        required: true
        type: string
      architecture:
        required: true
        type: string
      binary_name:
        required: true
        type: string
      self_contained:
        description: Include CoreCLR with the plugin sidecar (the host is always NativeAOT)
        required: true
        type: boolean
      runtime_variant:
        description: Plugin sidecar runtime variant (SelfContained or NoRuntime)
        required: true
        type: string
      # Ship CoreCLR plugin sidecar zip in the scatter layout (opaque payload; not in-process IL).
      # Installed by C launcher into the OOBE data directory; host reads PCL_PLUGIN_SIDECAR_*.
      embed_plugin_sidecar:
        required: false
        default: true
        type: boolean
      # Legacy alias kept for older callers; prefer embed_plugin_sidecar.
      include_plugin:
        required: false
        default: false
        type: boolean
      plugin_tag:
        description: PCL.Plugin source tag for sidecar build (empty = Latest channel / newest v* tag)
        required: false
        default: ""
        type: string
      require_ms_client_id:
        description: Fail the build when Microsoft OAuth CLIENT_ID secret is missing
        required: false
        default: true
        type: boolean
      # Channel stamped into embedded metadata.json (release | beta | ci).
      # Empty = derive from configuration (Release→release, Beta→beta, CI→ci).
      channel:
        required: false
        default: ""
        type: string
      # Optional release tag (e.g. v1.1.6-release) to fill version.base / consistency checks.
      version_tag:
        required: false
        default: ""
        type: string
    secrets:
      # Prefer CLIENT_ID (legacy name). MS_CLIENT_ID / PCL_MS_CLIENT_ID are accepted aliases.
      CLIENT_ID:
        required: false
      MS_CLIENT_ID:
        required: false
      PCL_MS_CLIENT_ID:
        required: false
      LITTLESKIN_CLIENT_ID:
        required: false
      LITTLESKIN_CLIENT_SECRET:
        required: false
      LITTLESKIN_REDIRECT_URI:
        required: false
      CURSEFORGE_API_KEY:
        required: false
      SENTRY_DSN:
        required: false
      SENTRY_ESSENTIAL_DSN:
        required: false
      POSTHOG_PROJECT_TOKEN:
        required: false
      POSTHOG_HOST:
        required: false
      NAID_CLIENT_ID:
        required: false
      NAID_CLIENT_SECRET:
        required: false
      LINK_SERVER_ROOTS:
        required: false
      LOBBY_DEFAULT_SECRET:
        required: false
      # PAT for private PCL.Plugin (contents:read).
      # Release and beta channels fail before checkout when this secret is absent.
      PCL_PLUGIN_TOKEN:
        required: false
jobs:
  build:
    name: ${{ inputs.runtime_id }} / ${{ inputs.runtime_variant }}
    runs-on: ${{ inputs.runner }}
    env:
      LANG: en_US.UTF-8
      PUBLISH_DIR: artifact
      ARTIFACT_NAME: PCL_N_${{ inputs.configuration }}_${{ inputs.runtime_id }}_${{ inputs.runtime_variant }}
      # Stabilize MSBuild node crashes (MSB4166) on constrained runners.
      DOTNET_CLI_UI_LANGUAGE: en
      MSBUILDDISABLENODEREUSE: 1

    steps:
      - name: Checkout Avalonia branch
        uses: actions/checkout@v6
        with:
          # Desktop ProjectReference → external/Jvm.NET; empty submodule dir fails the graph.
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Private PCL.Plugin is not visible to the repository GITHUB_TOKEN.
      # Release and beta builds must use PCL_PLUGIN_TOKEN; CI/dev may build host-only
      # so forks and untrusted pull requests remain buildable without secrets.
      - name: Plan plugin sidecar embed
        id: plugin_plan
        shell: bash
        env:
          WANT_EMBED: ${{ inputs.embed_plugin_sidecar || inputs.include_plugin }}
          HAS_PLUGIN_TOKEN: ${{ secrets.PCL_PLUGIN_TOKEN != '' }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          if [[ "${WANT_EMBED}" != "true" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Plugin embed disabled for this job."
            exit 0
          fi
          if [[ "${HAS_PLUGIN_TOKEN}" != "true" ]]; then
            if [[ "${CHANNEL}" == "ci" || "${CHANNEL}" == "dev" || -z "${CHANNEL}" ]]; then
              echo "::warning::PCL_PLUGIN_TOKEN is not set; building host-only (no embedded sidecar)."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::PCL_PLUGIN_TOKEN is required to embed private PCL.Plugin for channel=${CHANNEL}."
            echo "Add a fine-grained PAT with contents:read access to PCL-N-Edition/PCL.Plugin as repository secret PCL_PLUGIN_TOKEN."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "Plugin embed enabled (PCL_PLUGIN_TOKEN present)."

      - name: Checkout PCL-N-Plugin-SDK (sidecar build)
        if: ${{ steps.plugin_plan.outputs.enabled == 'true' }}
        uses: actions/checkout@v6
        with:
          repository: PCL-N-Edition/PCL-N-Plugin-SDK
          path: PCL-N-Plugin-SDK
          token: ${{ secrets.PCL_PLUGIN_TOKEN }}

      - name: Checkout PCL.Plugin source
        if: ${{ steps.plugin_plan.outputs.enabled == 'true' }}
        id: plugin_checkout
        continue-on-error: ${{ inputs.channel == 'ci' || inputs.channel == 'dev' || inputs.channel == '' }}
        uses: actions/checkout@v6
        with:
          repository: PCL-N-Edition/PCL.Plugin
          path: PCL.Plugin
          token: ${{ secrets.PCL_PLUGIN_TOKEN }}
          fetch-depth: 0

      - name: Pin PCL.Plugin to Latest release tag
        if: ${{ steps.plugin_plan.outputs.enabled == 'true' && steps.plugin_checkout.conclusion == 'success' }}
        id: plugin_ref
        continue-on-error: ${{ inputs.channel == 'ci' || inputs.channel == 'dev' || inputs.channel == '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pluginRoot = Join-Path $env:GITHUB_WORKSPACE 'PCL.Plugin'
          if (-not (Test-Path -LiteralPath (Join-Path $pluginRoot 'PCL.Plugin.csproj'))) {
            throw "Private PCL.Plugin checkout is missing PCL.Plugin.csproj. Check PCL_PLUGIN_TOKEN access."
          }

          $tag = '${{ inputs.plugin_tag }}'.Trim()
          if (-not $tag) {
            & git -C $pluginRoot fetch --tags --force origin 2>$null | Out-Null
            $names = @(& git -C $pluginRoot tag -l 'v*')
            if ($names.Count -eq 0) {
              throw "No v* tags in PCL.Plugin checkout. Pass plugin_tag input or publish a plugin release tag."
            }
            $tag = @(
              $names | Sort-Object {
                $t = $_ -replace '^v', '' -replace '-.*$', ''
                try { [version]$t } catch { [version]'0.0.0' }
              } -Descending
            ) | Select-Object -First 1
            Write-Host "Resolved plugin tag via git tags: $tag"
          }

          & git -C $pluginRoot checkout --force $tag
          if ($LASTEXITCODE -ne 0) { throw "git checkout $tag failed in PCL.Plugin" }
          & git -C $pluginRoot reset --hard $tag
          if ($LASTEXITCODE -ne 0) { throw "git reset --hard $tag failed in PCL.Plugin" }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Pinned PCL.Plugin @ $tag"

      - name: Pack plugin sidecar zip for host embed
        if: ${{ steps.plugin_plan.outputs.enabled == 'true' && steps.plugin_ref.conclusion == 'success' }}
        id: sidecar_zip
        continue-on-error: ${{ inputs.channel == 'ci' || inputs.channel == 'dev' || inputs.channel == '' }}
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE "artifacts/PCL.Plugin.Sidecar.${{ inputs.runtime_id }}.zip"
          $selfContained = [System.Convert]::ToBoolean('${{ inputs.self_contained }}')
          & ./scripts/pack-plugin-sidecar-zip.ps1 `
            -Configuration '${{ inputs.configuration }}' `
            -Runtime '${{ inputs.runtime_id }}' `
            -OutputZip $zip `
            -SelfContained:$selfContained `
            -SkipFetch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath $zip)) { throw "Sidecar zip missing: $zip" }
          "path=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Sidecar zip ready: $zip (plugin ${{ steps.plugin_ref.outputs.tag }})"

      - name: Require plugin embed for non-CI channels
        if: ${{ (inputs.embed_plugin_sidecar || inputs.include_plugin) && inputs.channel != 'ci' && inputs.channel != 'dev' && inputs.channel != '' && steps.sidecar_zip.outputs.path == '' }}
        shell: bash
        run: |
          echo "::error::Failed to embed PCL.Plugin sidecar for channel=${{ inputs.channel }}."
          echo "Ensure PCL_PLUGIN_TOKEN can read private PCL.Plugin and that a v* plugin tag exists."
          exit 1

      - name: Resolve Microsoft Client ID secret
        id: ms_client
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          PCL_MS_CLIENT_ID: ${{ secrets.PCL_MS_CLIENT_ID }}
        run: |
          set -euo pipefail
          value=""
          if [[ -n "${PCL_MS_CLIENT_ID:-}" ]]; then
            value="$PCL_MS_CLIENT_ID"
          elif [[ -n "${MS_CLIENT_ID:-}" ]]; then
            value="$MS_CLIENT_ID"
          elif [[ -n "${CLIENT_ID:-}" ]]; then
            value="$CLIENT_ID"
          fi
          echo "has_value=$([[ -n "$value" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # Mask and export for later steps (do not print value).
          if [[ -n "$value" ]]; then
            echo "::add-mask::$value"
            echo "PCL_MS_CLIENT_ID=$value" >> "$GITHUB_ENV"
          fi

      - name: Require Microsoft Client ID for publish builds
        if: ${{ inputs.require_ms_client_id }}
        shell: bash
        run: |
          if [[ "${{ steps.ms_client.outputs.has_value }}" != "true" ]]; then
            echo "::error::Missing Microsoft OAuth client id secret."
            echo "Add a repository secret named CLIENT_ID (or MS_CLIENT_ID / PCL_MS_CLIENT_ID)."
            echo "It is embedded into the binary at publish time via PCL_WRITE_SECRET."
            exit 1
          fi
          echo "Microsoft CLIENT_ID secret is present (value masked)."

      - name: Stamp build metadata (channel / version / commit)
        id: stamp
        shell: bash
        env:
          PCL_GITHUB_SHA: ${{ github.sha }}
        run: |
          set -eo pipefail
          cfg="${{ inputs.configuration }}"
          channel="${{ inputs.channel }}"
          if [[ -z "${channel}" ]]; then
            case "${cfg,,}" in
              release|stable) channel=release ;;
              beta) channel=beta ;;
              ci|dev) channel=ci ;;
              *) channel=ci ;;
            esac
          fi
          tag="${{ inputs.version_tag }}"
          extra=()
          if [[ -n "${tag}" ]]; then
            extra+=(--tag "${tag}")
          fi
          # Windows runners often only expose `python`, not `python3`.
          if command -v python3 >/dev/null 2>&1; then
            PY=python3
          else
            PY=python
          fi
          "$PY" scripts/stamp_build_metadata.py \
            --metadata PCL.Desktop/metadata.json \
            --channel "${channel}" \
            --sha "${PCL_GITHUB_SHA}" \
            --github-output \
            ${extra[@]+"${extra[@]}"}
          echo "Stamped metadata:"
          cat PCL.Desktop/metadata.json

      - name: Bootstrap launcher patch client
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" tools/pcl-n-patches/scripts/bootstrap_hdiffpatch.py \
            --tools-dir "${{ github.workspace }}/update-tools"
          if [[ -f "${{ github.workspace }}/update-tools/hpatchz.exe" ]]; then
            tool="${{ github.workspace }}/update-tools/hpatchz.exe"
          else
            tool="${{ github.workspace }}/update-tools/hpatchz"
          fi
          test -s "$tool"
          echo "PCL_HPATCHZ_PATH=$tool" >> "$GITHUB_ENV"

      - name: Publish Avalonia desktop
        shell: bash
        env:
          PCL_WRITE_SECRET: '1'
          # Prefer env written by Resolve step; fall back to raw secrets for other keys.
          PCL_MS_CLIENT_ID: ${{ env.PCL_MS_CLIENT_ID }}
          PCL_LITTLESKIN_CLIENT_ID: ${{ secrets.LITTLESKIN_CLIENT_ID }}
          PCL_LITTLESKIN_CLIENT_SECRET: ${{ secrets.LITTLESKIN_CLIENT_SECRET }}
          PCL_LITTLESKIN_REDIRECT_URI: ${{ secrets.LITTLESKIN_REDIRECT_URI }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          PCL_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          PCL_SENTRY_ESSENTIAL_DSN: ${{ secrets.SENTRY_ESSENTIAL_DSN }}
          PCL_POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          PCL_POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          PCL_NAID_CLIENT_ID: ${{ secrets.NAID_CLIENT_ID }}
          PCL_NAID_CLIENT_SECRET: ${{ secrets.NAID_CLIENT_SECRET }}
          PCL_LINK_SERVER_ROOT: ${{ secrets.LINK_SERVER_ROOTS }}
          PCL_LOBBY_DEFAULT_SECRET: ${{ secrets.LOBBY_DEFAULT_SECRET }}
          PCL_GITHUB_SHA: ${{ github.sha }}
        run: |
          set -eo pipefail

          version_args=()
          if [[ -n "${PCL_STAMPED_ASSEMBLY_VERSION:-}" ]]; then
            version_args+=(-p:Version="${PCL_STAMPED_ASSEMBLY_VERSION}")
          fi
          if [[ -n "${PCL_STAMPED_INFORMATIONAL_VERSION:-}" ]]; then
            version_args+=(-p:InformationalVersion="${PCL_STAMPED_INFORMATIONAL_VERSION}")
          fi

          # Single-node publish reduces MSB4166 crashes.
          # Host is NativeAOT without embedded native/sidecar zips (scatter layout).
          # SelfContained/NoRuntime still describes the plugin sidecar CoreCLR payload.
          sidecar_zip="${{ steps.sidecar_zip.outputs.path }}"
          if [[ -n "${sidecar_zip}" && -f "${sidecar_zip}" ]]; then
            echo "Plugin sidecar zip for scatter payload: ${sidecar_zip}"
          else
            echo "No plugin sidecar zip — scatter layout will omit sidecar.zip."
            sidecar_zip=""
          fi

          native_stage="$RUNNER_TEMP/pcln-native-${{ inputs.runtime_id }}"
          native_zip="$RUNNER_TEMP/PCL.NativeRuntime.${{ inputs.runtime_id }}.zip"
          host_stage="$RUNNER_TEMP/pcln-host-${{ inputs.runtime_id }}"
          rm -rf "$native_stage" "$host_stage" "$PUBLISH_DIR" "$native_zip"
          mkdir -p "$native_stage" "$host_stage" "$PUBLISH_DIR"

          # Pass 1: publish AOT host and harvest RID-specific native DLLs (no embed).
          dotnet publish PCL.Desktop/PCL.Desktop.csproj \
            -c "${{ inputs.configuration }}" \
            -r "${{ inputs.runtime_id }}" \
            --self-contained true \
            -m:1 \
            -nodeReuse:false \
            -p:Platform="${{ inputs.architecture }}" \
            -p:PublishAot=true \
            -p:PublishTrimmed=true \
            -p:PublishSingleFile=false \
            -p:PclRuntimeVariant="${{ inputs.runtime_variant }}" \
            -p:PclHpatchzPath="$PCL_HPATCHZ_PATH" \
            -p:PclWriteSecret=1 \
            -p:PclPluginSidecarZipPath= \
            -p:PclNativeRuntimeZipPath= \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:DeleteExistingFiles=true \
            ${version_args[@]+"${version_args[@]}"} \
            -warnaserror:CA1416 \
            -o "$native_stage"

          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/pack_native_runtime.py \
            "$native_stage" \
            "$native_zip" \
            --binary "${{ inputs.binary_name }}"

          # Host binary only (same product publish identity; no second embed pass).
          host_bin="$native_stage/${{ inputs.binary_name }}"
          test -s "$host_bin"
          cp -f "$host_bin" "$host_stage/${{ inputs.binary_name }}"

          # C bootstrap: entry stays PCL-N-Edition; deps as scatter files.
          chmod +x scripts/build-native-bootstrap.sh scripts/assemble-release-layout.sh
          scripts/build-native-bootstrap.sh
          if [[ -f "$PWD/native/pcln-launcher/pcln-launcher.exe" ]]; then
            PCLN_LAUNCHER_BIN="$PWD/native/pcln-launcher/pcln-launcher.exe"
            PCLN_CRASH_BIN="$PWD/native/pcln-crash-handler/pcln-crash-handler.exe"
          else
            PCLN_LAUNCHER_BIN="$PWD/native/pcln-launcher/pcln-launcher"
            PCLN_CRASH_BIN="$PWD/native/pcln-crash-handler/pcln-crash-handler"
          fi
          test -s "$PCLN_LAUNCHER_BIN"
          test -s "$PCLN_CRASH_BIN"

          assemble_args=(
            --out "$PUBLISH_DIR"
            --host "$host_stage/${{ inputs.binary_name }}"
            --product-name "${{ inputs.binary_name }}"
            --native-zip "$native_zip"
            --launcher "$PCLN_LAUNCHER_BIN"
            --crash "$PCLN_CRASH_BIN"
          )
          if [[ -n "$sidecar_zip" ]]; then
            assemble_args+=(--sidecar-zip "$sidecar_zip")
          fi
          scripts/assemble-release-layout.sh "${assemble_args[@]}"

          # Windows portable channel: single-file NativeAOT with embedded native/sidecar.
          # Installers keep the expanded scatter tree; portable is a separate exe asset.
          if [[ "${{ inputs.runtime_id }}" == win-* ]]; then
            portable_stage="$RUNNER_TEMP/pcln-portable-${{ inputs.runtime_id }}"
            rm -rf "$portable_stage"
            mkdir -p "$portable_stage"
            sidecar_args=()
            if [[ -n "$sidecar_zip" ]]; then
              sidecar_args+=(-p:PclPluginSidecarZipPath="${sidecar_zip}")
            fi
            dotnet publish PCL.Desktop/PCL.Desktop.csproj \
              -c "${{ inputs.configuration }}" \
              -r "${{ inputs.runtime_id }}" \
              --self-contained true \
              -m:1 \
              -nodeReuse:false \
              -p:Platform="${{ inputs.architecture }}" \
              -p:PublishAot=true \
              -p:PublishTrimmed=true \
              -p:PublishSingleFile=false \
              -p:PclRuntimeVariant="${{ inputs.runtime_variant }}" \
              -p:PclHpatchzPath="$PCL_HPATCHZ_PATH" \
              -p:PclWriteSecret=1 \
              -p:PclNativeRuntimeZipPath="$native_zip" \
              -p:DebugType=None \
              -p:DebugSymbols=false \
              -p:DeleteExistingFiles=true \
              ${sidecar_args[@]+"${sidecar_args[@]}"} \
              ${version_args[@]+"${version_args[@]}"} \
              -warnaserror:CA1416 \
              -o "$portable_stage"
            portable_bin="$portable_stage/${{ inputs.binary_name }}"
            test -s "$portable_bin"
            # Keep product scatter entry as C launcher; portable is a sibling asset.
            cp -f "$portable_bin" "$PUBLISH_DIR/PCL-N-Portable.exe"
            find "$portable_stage" -type f \( -name '*.pdb' -o -name '*.xml' \) -delete || true
            echo "Built single-file portable host: $PUBLISH_DIR/PCL-N-Portable.exe"
          fi

      - name: Validate scatter layout artifact
        shell: bash
        run: |
          set -euo pipefail
          binary="$PUBLISH_DIR/${{ inputs.binary_name }}"
          test -s "$binary" || {
            echo "::error file=$binary::Product entry (C launcher) is missing."
            exit 1
          }
          if [[ "${{ inputs.binary_name }}" == *.exe ]]; then
            host_bin="$PUBLISH_DIR/host/PCL-N-Host.exe"
          else
            host_bin="$PUBLISH_DIR/host/PCL-N-Host"
          fi
          test -s "$host_bin" || {
            echo "::error file=$host_bin::AOT host binary is missing from scatter layout."
            exit 1
          }
          test -d "$PUBLISH_DIR/native" || {
            echo "::error::Fully-expanded native/ tree missing from scatter layout."
            exit 1
          }
          native_files=$(find "$PUBLISH_DIR/native" -type f | wc -l | tr -d ' ')
          if [[ "$native_files" -lt 1 ]]; then
            echo "::error::native/ tree is empty."
            exit 1
          fi
          # No runtime zips in the published product tree.
          if find "$PUBLISH_DIR" -type f -name '*.zip' | grep -q .; then
            echo "::error::Published scatter layout must not contain .zip files (fully expanded)."
            find "$PUBLISH_DIR" -type f -name '*.zip' -print
            exit 1
          fi
          test -f "$PUBLISH_DIR/pcln-layout"

          find "$PUBLISH_DIR" -type f \( -name '*.pdb' -o -name '*.xml' -o -name '*.dbg' \) -delete
          find "$PUBLISH_DIR" -type f \( -name 'PCL.Desktop' -o -name 'PCL.Desktop.exe' \) -delete

          if [[ "${{ inputs.runtime_id }}" == win-* ]]; then
            test -s "$PUBLISH_DIR/PCL-N-Portable.exe" || {
              echo "::error::Windows single-file portable binary is missing (PCL-N-Portable.exe)."
              exit 1
            }
          fi

          file_count=$(find "$PUBLISH_DIR" -type f | wc -l | tr -d ' ')
          if [[ "$file_count" -lt 5 ]]; then
            echo "::error::Expected fully-expanded multi-file scatter layout, found $file_count files."
            find "$PUBLISH_DIR" -maxdepth 3 -print
            exit 1
          fi
          echo "Scatter layout validated ($file_count files, native=$native_files). Entry=$binary Host=$host_bin"

          chmod +x "$binary" "$host_bin" || true

          rid="${{ inputs.runtime_id }}"
          need_os=""
          need_arch=""
          case "$rid" in
            win-x64) need_os=Windows; need_arch=X64 ;;
            win-arm64) need_os=Windows; need_arch=ARM64 ;;
            linux-x64) need_os=Linux; need_arch=X64 ;;
            linux-arm64) need_os=Linux; need_arch=ARM64 ;;
            osx-x64) need_os=macOS; need_arch=X64 ;;
            osx-arm64) need_os=macOS; need_arch=ARM64 ;;
          esac

          can_execute=false
          if [[ -n "$need_os" && -n "$need_arch" &&
                "${{ runner.os }}" == "$need_os" &&
                "${{ runner.arch }}" == "$need_arch" ]]; then
            can_execute=true
          fi

          if [[ "$can_execute" == "true" ]]; then
            export PCL_NATIVE_RUNTIME_DIR="$PUBLISH_DIR/native"
            export PCL_SKIP_EXTERNAL_CRASH_HANDLER=1
            if ! "$host_bin" --validate-native-runtime; then
              echo "::error::AOT host cannot load expanded native/ runtime (Skia/HarfBuzz)."
              exit 1
            fi
            echo "Expanded native runtime validation passed."

            if [[ "${{ inputs.require_ms_client_id }}" == "true" ]]; then
              if ! "$host_bin" --validate-secrets; then
                echo "::error::AOT host is missing embedded secrets (PCL_WRITE_SECRET / CLIENT_ID)."
                exit 1
              fi
              echo "Embedded secrets validation passed (host execute)."
            fi

            if [[ -f "$PUBLISH_DIR/PCL-N-Portable.exe" ]]; then
              if ! "$PUBLISH_DIR/PCL-N-Portable.exe" --validate-native-runtime; then
                echo "::error::Portable single-file host cannot load its embedded native runtime."
                exit 1
              fi
              echo "Portable single-file native runtime validation passed."
            fi
          else
            echo "Skipping host execution for cross-arch RID '$rid' on ${{ runner.os }}/${{ runner.arch }}."
            if [[ "${{ inputs.require_ms_client_id }}" == "true" ]]; then
              echo "Secret presence was already enforced at build time (require_ms_client_id + PCL_WRITE_SECRET)."
            fi
          fi

      - name: Create macOS application bundle
        if: ${{ startsWith(inputs.runtime_id, 'osx-') }}
        shell: bash
        run: |
          set -euo pipefail
          app="$PUBLISH_DIR/PCL N.app"
          contents="$app/Contents"
          executable="$contents/MacOS/${{ inputs.binary_name }}"
          resources="$contents/Resources"
          iconset="$RUNNER_TEMP/PCL-N.iconset"
          mac_icon="$RUNNER_TEMP/PCL-N-macos.png"
          plist="$contents/Info.plist"

          mkdir -p "$contents/MacOS" "$resources" "$iconset"
          shopt -s dotglob nullglob
          for item in "$PUBLISH_DIR"/*; do
            [[ "$item" == "$app" ]] && continue
            # Portable single-file is Windows-only; never stuff it into the .app.
            base="$(basename "$item")"
            if [[ "$base" == "PCL-N-Portable.exe" || "$base" == "PCL-N-Portable" ]]; then
              continue
            fi
            mv "$item" "$contents/MacOS/"
          done
          chmod +x "$executable"

          # Preserve the PCL artwork pixel-for-pixel while presenting it inside
          # the white rounded application tile expected by modern macOS.
          swift scripts/generate-macos-icon.swift \
            PCL.Desktop/Assets/icon.png "$mac_icon"
          for size in 16 32 128 256 512; do
            double=$((size * 2))
            sips -z "$size" "$size" "$mac_icon" \
              --out "$iconset/icon_${size}x${size}.png" >/dev/null
            sips -z "$double" "$double" "$mac_icon" \
              --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$resources/PCL-N.icns"

          version="${PCL_STAMPED_ASSEMBLY_VERSION:-1.0.0}"
          short_version="${version%%-*}"
          bundle_version="$(printf '%s' "$version" | sed -E 's/[^0-9.].*$//; s/\.$//')"
          bundle_version="${bundle_version:-1.0.0}"
          plutil -create xml1 "$plist"
          plutil -insert CFBundleDevelopmentRegion -string en "$plist"
          plutil -insert CFBundleDisplayName -string 'PCL N' "$plist"
          plutil -insert CFBundleExecutable -string '${{ inputs.binary_name }}' "$plist"
          plutil -insert CFBundleIconFile -string PCL-N "$plist"
          plutil -insert CFBundleIdentifier -string io.github.pcl-n-edition.pcl-n "$plist"
          plutil -insert CFBundleInfoDictionaryVersion -string '6.0' "$plist"
          plutil -insert CFBundleName -string 'PCL N' "$plist"
          plutil -insert CFBundlePackageType -string APPL "$plist"
          plutil -insert CFBundleShortVersionString -string "$short_version" "$plist"
          plutil -insert CFBundleVersion -string "$bundle_version" "$plist"
          plutil -insert LSMinimumSystemVersion -string '12.0' "$plist"
          plutil -insert NSHighResolutionCapable -bool true "$plist"

          codesign --force --deep --sign - "$app"
          plutil -lint "$plist"
          codesign --verify --deep --strict "$app"
          test -x "$executable"

      - name: Upload Avalonia build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact
          if-no-files-found: error

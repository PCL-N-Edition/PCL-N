name: Publish Avalonia (Beta)

permissions:
  contents: write

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing prerelease tag to upload assets to
        required: true
        type: string
      skip_patches:
        description: Skip all-history binary patch generation
        required: false
        type: boolean
        default: false

concurrency:
  group: release-beta-${{ github.event.release.tag_name || inputs.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    # ci-latest is a rolling full-package release owned by build-test.yml. A newly
    # created CI release also emits release.published, but must never enter the
    # Beta build or all-history patch pipeline.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.tag_name != 'ci-latest') || (github.event_name == 'release' && github.event.release.prerelease && github.event.release.tag_name != 'ci-latest') }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { runner: windows-latest, runtime_id: win-x64, architecture: x64, binary_name: PCL-N-Edition.exe }
          - { runner: windows-latest, runtime_id: win-arm64, architecture: ARM64, binary_name: PCL-N-Edition.exe }
          - { runner: ubuntu-latest, runtime_id: linux-x64, architecture: x64, binary_name: PCL-N-Edition }
          - { runner: ubuntu-24.04-arm, runtime_id: linux-arm64, architecture: ARM64, binary_name: PCL-N-Edition }
          - { runner: macos-latest, runtime_id: osx-x64, architecture: x64, binary_name: PCL-N-Edition }
          - { runner: macos-latest, runtime_id: osx-arm64, architecture: ARM64, binary_name: PCL-N-Edition }
        runtime:
          - { self_contained: true, variant: SelfContained }
          - { self_contained: false, variant: NoRuntime }

    uses: ./.github/workflows/reusable-build.yml
    with:
      configuration: Beta
      runner: ${{ matrix.target.runner }}
      runtime_id: ${{ matrix.target.runtime_id }}
      architecture: ${{ matrix.target.architecture }}
      binary_name: ${{ matrix.target.binary_name }}
      self_contained: ${{ matrix.runtime.self_contained }}
      runtime_variant: ${{ matrix.runtime.variant }}
      channel: beta
      version_tag: ${{ github.event.release.tag_name || inputs.tag_name }}
    secrets: inherit

  # Early stub notes (commits only). Full inventory is written after assets/patches.
  changelog:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    continue-on-error: true
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.tag_name != 'ci-latest') || (github.event_name == 'release' && github.event.release.prerelease && github.event.release.tag_name != 'ci-latest') }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@git-cliff
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate provisional release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_release_notes.py \
            --repo "${{ github.repository }}" \
            --tag "${{ github.event.release.tag_name || inputs.tag_name }}" \
            --repo-root "${{ github.workspace }}" \
            -o RELEASE_NOTES.md \
            --publish \
            --skip-inventory

  publish-assets:
    permissions:
      contents: write
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # softprops/action-gh-release finalizes the Release after every upload.
      # Serializing only this matrix avoids concurrent finalization races while
      # keeping the expensive cross-platform builds fully parallel.
      max-parallel: 1
      matrix:
        target:
          - { runtime_id: win-x64, binary_name: PCL-N-Edition.exe, package: zip }
          - { runtime_id: win-arm64, binary_name: PCL-N-Edition.exe, package: zip }
          - { runtime_id: linux-x64, binary_name: PCL-N-Edition, package: tar }
          - { runtime_id: linux-arm64, binary_name: PCL-N-Edition, package: tar }
          - { runtime_id: osx-x64, binary_name: PCL-N-Edition, package: tar }
          - { runtime_id: osx-arm64, binary_name: PCL-N-Edition, package: tar }
        runtime_variant: [SelfContained, NoRuntime]
    steps:
      - name: Download Avalonia artifact
        uses: actions/download-artifact@v4
        with:
          name: PCL_N_Beta_${{ matrix.target.runtime_id }}_${{ matrix.runtime_variant }}
          path: artifact

      - name: Package prerelease asset
        shell: bash
        run: |
          base="PCL_N_Beta_${{ matrix.target.runtime_id }}_${{ matrix.runtime_variant }}"
          mkdir -p dist
          if [[ "${{ matrix.target.runtime_id }}" == osx-* ]]; then
            binary="artifact/PCL N.app/Contents/MacOS/${{ matrix.target.binary_name }}"
            chmod +x "$binary"
            test -x "$binary"
            tar -C artifact -czf "dist/${base}.tar.gz" "PCL N.app"
          elif [[ "${{ matrix.target.package }}" == "zip" ]]; then
            chmod +x "artifact/${{ matrix.target.binary_name }}" || true
            (cd artifact && zip -9 -r "../dist/${base}.zip" .)
          else
            chmod +x "artifact/${{ matrix.target.binary_name }}"
            tar -C artifact -czf "dist/${base}.tar.gz" .
          fi

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign prerelease asset
        shell: bash
        run: |
          asset=$(find dist -maxdepth 1 -type f | head -n 1)
          gpg --detach-sign --armor "$asset"
          binary="artifact/${{ matrix.target.binary_name }}"
          if [[ "${{ matrix.target.runtime_id }}" == osx-* ]]; then
            binary="artifact/PCL N.app/Contents/MacOS/${{ matrix.target.binary_name }}"
          fi
          gpg --detach-sign --armor --output "$asset.binary.asc" "$binary"

      - name: Upload Avalonia assets to prerelease
        uses: softprops/action-gh-release@v2.5.0
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag_name }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # After full builds are on the prerelease, generate direct patches from the
  # recent rollback window. Older clients can chain indexes or use a full package.
  generate-patches:
    name: Generate version patches
    needs: [publish-assets]
    if: ${{ always() && needs.publish-assets.result == 'success' && (github.event.release.tag_name || inputs.tag_name) != 'ci-latest' && !(github.event_name == 'workflow_dispatch' && inputs.skip_patches) }}
    uses: ./.github/workflows/generate-launcher-patches.yml
    with:
      target_tag: ${{ github.event.release.tag_name || inputs.tag_name }}
      configuration: Beta
      max_from_versions: 10
      hop_interval: 10
      include_prerelease_history: true
    secrets:
      PATCHES_REPO_TOKEN: ${{ secrets.PATCHES_REPO_TOKEN }}

  # Final notes: changelog + structured Release inventory (after packages ± patches).
  finalize-release-notes:
    name: Finalize release notes
    needs: [publish-assets, generate-patches]
    if: ${{ always() && needs.publish-assets.result == 'success' && (needs.generate-patches.result == 'success' || needs.generate-patches.result == 'skipped') }}
    uses: ./.github/workflows/update-release-notes.yml
    with:
      tag_name: ${{ github.event.release.tag_name || inputs.tag_name }}
      cleanup_legacy: true

name: XSR CI

on:
  push:
    branches:
      - refactor/xsr
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm-host:
    name: NativeAOT JNI host (${{ matrix.os }}, Java ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        java: ['8', '17', '21', '25']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Publish isolated JNI host
        run: dotnet publish Nexa.Jvm.Host -c Release -p:PublishAot=true -o native-jvm-host
      - name: Exercise real JVM lifecycle
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { './native-jvm-host/Nexa.Jvm.Host.exe' } else { './native-jvm-host/Nexa.Jvm.Host' }
          ./eng/xsr/Test-JvmHost.ps1 -HostExecutable $binary -JavaHome $env:JAVA_HOME

  account-security:
    name: Native account protection (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      NEXA_TEST_SYSTEM_KEYRING: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Prepare Linux keyring
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11 clang zlib1g-dev
      - name: Prepare disposable macOS keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p '' "$RUNNER_TEMP/nexa-test.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/nexa-test.keychain-db"
          security unlock-keychain -p '' "$RUNNER_TEMP/nexa-test.keychain-db"
      - name: Publish NativeAOT account tests
        run: dotnet publish tests/Nexa.Services.Tests -c Release -p:PublishAot=true -o native-account-tests
      - name: Run Windows native protection
        if: runner.os == 'Windows'
        run: ./native-account-tests/Nexa.Services.Tests.exe "native profile protection"
      - name: Run macOS native protection
        if: runner.os == 'macOS'
        run: ./native-account-tests/Nexa.Services.Tests "native profile protection"
      - name: Run Linux native protection
        if: runner.os == 'Linux'
        run: dbus-run-session -- sh -c 'printf "\n" | gnome-keyring-daemon --unlock; ./native-account-tests/Nexa.Services.Tests "native profile protection"'
  build:
    name: Build and architecture gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore NexaCL.slnx

      - name: Build
        run: dotnet build NexaCL.slnx --configuration Release --no-restore -p:XsrVersionChannel=ci

      - name: Validate generated PXML control catalogs
        shell: bash
        run: |
          generated_catalog="$(find Nexa.Pxml.Compiler/obj/Release -name PxmlControlCatalog.g.cs -print -quit)"
          if [[ -z "${generated_catalog}" ]] || ! grep -q "PxmlIrNodeKind.Page" "${generated_catalog}"; then
            echo "The default PXML control catalog was not materialized." >&2
            exit 1
          fi

          dotnet build Nexa.Pxml.Compiler/Nexa.Pxml.Compiler.csproj \
            --configuration Release \
            --no-restore \
            -p:XsrVersionChannel=ci \
            -p:PxmlControlCatalogDirectory="${GITHUB_WORKSPACE}/tests/Nexa.Pxml.Tests/Fixtures/AlternateCatalog"
          if ! grep -q "PxmlIrNodeKind.Card" "${generated_catalog}"; then
            echo "The alternate PXML control catalog was not expanded." >&2
            exit 1
          fi

          invalid_log="${RUNNER_TEMP}/pxml-invalid-catalog.log"
          if dotnet build Nexa.Pxml.Compiler/Nexa.Pxml.Compiler.csproj \
            --configuration Release \
            --no-restore \
            -p:XsrVersionChannel=ci \
            -p:PxmlControlCatalogDirectory="${GITHUB_WORKSPACE}/tests/Nexa.Pxml.Tests/Fixtures/InvalidCatalog" \
            2>&1 | tee "${invalid_log}"; then
            echo "The invalid PXML control catalog unexpectedly compiled." >&2
            exit 1
          fi
          grep -q "PXMLGEN002" "${invalid_log}"

          missing_catalog="${RUNNER_TEMP}/pxml-catalog-does-not-exist"
          if [[ -e "${missing_catalog}" ]]; then
            echo "The missing-catalog fixture path unexpectedly exists." >&2
            exit 1
          fi
          if dotnet msbuild Nexa.Pxml.Compiler/Nexa.Pxml.Compiler.csproj \
            -target:ValidatePxmlControlCatalog \
            -nologo \
            -p:PxmlControlCatalogDirectory="${missing_catalog}"; then
            echo "A missing PXML control catalog unexpectedly passed validation." >&2
            exit 1
          fi

          dotnet build Nexa.Pxml.Compiler/Nexa.Pxml.Compiler.csproj \
            --configuration Release \
            --no-restore \
            -p:XsrVersionChannel=ci
          grep -q "PxmlIrNodeKind.Page" "${generated_catalog}"

      - name: Test XSR runtime kernel
        run: dotnet run --project tests/Nexa.Xsr.Runtime.Tests/Nexa.Xsr.Runtime.Tests.csproj --configuration Release --no-build

      - name: Publish and run NativeAOT runtime tests
        run: |
          dotnet publish tests/Nexa.Xsr.Runtime.Tests/Nexa.Xsr.Runtime.Tests.csproj \
            --configuration Release \
            -p:XsrVersionChannel=ci \
            -p:PublishAot=true \
            -p:StripSymbols=true \
            --output "${{ runner.temp }}/xsr-runtime-aot"
          "${{ runner.temp }}/xsr-runtime-aot/Nexa.Xsr.Runtime.Tests"

      - name: Test UI.Next renderer kernel
        run: dotnet run --project tests/Nexa.UI.Next.Tests/Nexa.UI.Next.Tests.csproj --configuration Release --no-build

      - name: Test Avalonia scene backend
        run: dotnet run --project tests/Nexa.UI.Next.Backend.Avalonia.Tests/Nexa.UI.Next.Backend.Avalonia.Tests.csproj --configuration Release --no-build

      - name: Publish and run NativeAOT renderer tests
        run: |
          dotnet publish tests/Nexa.UI.Next.Tests/Nexa.UI.Next.Tests.csproj \
            --configuration Release \
            -p:XsrVersionChannel=ci \
            -p:PublishAot=true \
            -p:StripSymbols=true \
            --output "${{ runner.temp }}/uinext-aot"
          "${{ runner.temp }}/uinext-aot/Nexa.UI.Next.Tests"

      - name: Test PXML compiler pipeline
        run: dotnet run --project tests/Nexa.Pxml.Tests/Nexa.Pxml.Tests.csproj --configuration Release --no-build

      - name: Publish and run NativeAOT PXML tests
        run: |
          dotnet publish tests/Nexa.Pxml.Tests/Nexa.Pxml.Tests.csproj \
            --configuration Release \
            -p:XsrVersionChannel=ci \
            -p:PublishAot=true \
            -p:StripSymbols=true \
            --output "${{ runner.temp }}/pxml-aot"
          "${{ runner.temp }}/pxml-aot/Nexa.Pxml.Tests"

      - name: Test Sidecar protocol and transport
        run: dotnet run --project tests/Nexa.Sidecar.Tests/Nexa.Sidecar.Tests.csproj --configuration Release --no-build

      - name: Test Sidecar host session and data plane
        run: dotnet run --project tests/Nexa.Xsr.Runtime.Tests/Nexa.Xsr.Runtime.Tests.csproj --configuration Release --no-build

      - name: Install Xvfb for the X11 probe smoke
        run: sudo apt-get install -y xvfb libx11-6

      - name: Test foundation services
        run: xvfb-run -a dotnet run --project tests/Nexa.Services.Tests/Nexa.Services.Tests.csproj --configuration Release --no-build

      - name: Test desktop composition
        run: dotnet run --project tests/Nexa.Desktop.Tests/Nexa.Desktop.Tests.csproj --configuration Release --no-build

      - name: Publish and run NativeAOT foundation tests
        run: |
          dotnet publish tests/Nexa.Services.Tests/Nexa.Services.Tests.csproj             --configuration Release             -p:XsrVersionChannel=ci             -p:PublishAot=true             -p:StripSymbols=true             --output "${{ runner.temp }}/foundation-aot"
          xvfb-run -a "${{ runner.temp }}/foundation-aot/Nexa.Services.Tests"

      - name: Enforce UI.Next benchmark gates
        run: dotnet run --project Nexa.UI.Next.Benchmarks/Nexa.UI.Next.Benchmarks.csproj --configuration Release --no-build

      - name: Enforce architecture boundaries
        run: dotnet run --project tests/Nexa.Xsr.ArchitectureTests/Nexa.Xsr.ArchitectureTests.csproj --configuration Release --no-build -- --repo-root .

      - name: Verify source formatting
        run: dotnet format NexaCL.slnx --no-restore --verify-no-changes --diagnostics IDE0055 IMPORTS

      - name: Publish and run NativeAOT Desktop shell smoke
        run: |
          dotnet publish Nexa.Desktop/Nexa.Desktop.csproj \
            --configuration Release \
            -p:XsrVersionChannel=ci \
            -p:PublishAot=true \
            -p:StripSymbols=true \
            -p:NexaMicrosoftClientId="${{ secrets.CLIENT_ID || secrets.MS_CLIENT_ID || secrets.NEXA_MS_CLIENT_ID || secrets.PCL_MS_CLIENT_ID }}" \
            -p:NexaLittleSkinClientId="${{ secrets.NEXA_LITTLESKIN_CLIENT_ID || secrets.PCL_LITTLESKIN_CLIENT_ID || secrets.LITTLESKIN_CLIENT_ID }}" \
            --output "${{ runner.temp }}/pcl-desktop-aot"
          "${{ runner.temp }}/pcl-desktop-aot/Nexa.Desktop" --validate-shell

      - name: Run NativeAOT first-run shell smoke
        run: '"${{ runner.temp }}/pcl-desktop-aot/Nexa.Desktop" --validate-setup'

      - name: Analyze trimmed desktop composition
        run: >-
          dotnet publish Nexa.Desktop/Nexa.Desktop.csproj
          --configuration Release
          -p:XsrVersionChannel=ci
          -p:PublishTrimmed=true
          -p:TrimMode=link
          --output "${{ runner.temp }}/pcl-desktop-trimmed"

      - name: Run trimmed Desktop shell smoke
        run: '"${{ runner.temp }}/pcl-desktop-trimmed/Nexa.Desktop" --validate-shell'

      - name: Run trimmed first-run shell smoke
        run: '"${{ runner.temp }}/pcl-desktop-trimmed/Nexa.Desktop" --validate-setup'

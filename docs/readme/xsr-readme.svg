<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2460" viewBox="0 0 1200 2460" role="img" aria-labelledby="title desc">
  <title id="title">PCL Nexa — Minecraft launcher</title>
  <desc id="desc">PCL Nexa user-facing product introduction for the XSR alpha line.</desc>
  <defs>
    <linearGradient id="heroGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5AC8FA" stop-opacity="0.30"/>
      <stop offset="0.52" stop-color="#007AFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#AF52DE" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#5E5CE6"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.07"/>
    </filter>
    <style><![CDATA[
      svg { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft JhengHei", "Microsoft YaHei", sans-serif; }
      .bg { fill:#F5F5F7; }
      .surface { fill:#FFFFFF; fill-opacity:.80; stroke:#FFFFFF; stroke-opacity:.92; }
      .surface2 { fill:#FFFFFF; fill-opacity:.58; stroke:#000000; stroke-opacity:.055; }
      .surface3 { fill:#FFFFFF; fill-opacity:.36; stroke:#FFFFFF; stroke-opacity:.75; }
      .text { fill:#1D1D1F; }
      .secondary { fill:#6E6E73; }
      .tertiary { fill:#8E8E93; }
      .rule { stroke:#000000; stroke-opacity:.075; }
      .accentText { fill:#007AFF; }
      .success { fill:#34C759; }
      .warning { fill:#FF9F0A; }
      .chip { fill:#007AFF; fill-opacity:.08; stroke:#007AFF; stroke-opacity:.18; }
      .chipText { fill:#0066CC; }
      .title { font-size:92px; font-weight:700; letter-spacing:-4.8px; }
      .display { font-size:54px; font-weight:700; letter-spacing:-2.2px; }
      .h2 { font-size:34px; font-weight:700; letter-spacing:-.8px; }
      .h3 { font-size:24px; font-weight:650; letter-spacing:-.25px; }
      .body { font-size:22px; font-weight:450; }
      .bodyStrong { font-size:22px; font-weight:650; }
      .small { font-size:18px; font-weight:500; }
      .caption { font-size:16px; font-weight:550; letter-spacing:.10px; }
      .micro { font-size:14px; font-weight:650; letter-spacing:.6px; }
      @media (prefers-color-scheme: dark) {
        .bg { fill:#000000; }
        .surface { fill:#1C1C1E; fill-opacity:.76; stroke:#FFFFFF; stroke-opacity:.13; }
        .surface2 { fill:#2C2C2E; fill-opacity:.62; stroke:#FFFFFF; stroke-opacity:.08; }
        .surface3 { fill:#2C2C2E; fill-opacity:.36; stroke:#FFFFFF; stroke-opacity:.12; }
        .text { fill:#F5F5F7; }
        .secondary { fill:#AEAEB2; }
        .tertiary { fill:#8E8E93; }
        .rule { stroke:#FFFFFF; stroke-opacity:.10; }
        .accentText { fill:#0A84FF; }
        .chip { fill:#0A84FF; fill-opacity:.14; stroke:#0A84FF; stroke-opacity:.28; }
        .chipText { fill:#64D2FF; }
      }
    ]]></style>
  </defs>

  <rect class="bg" width="1200" height="2460"/>
  <circle cx="1030" cy="120" r="300" fill="url(#heroGlow)"/>
  <circle cx="120" cy="490" r="250" fill="url(#heroGlow)" opacity=".42"/>

  <g transform="translate(72 68)">
    <g>
      <rect width="138" height="38" rx="19" class="chip"/>
      <circle cx="21" cy="19" r="5" class="warning"/>
      <switch>
        <text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="36" y="25" class="micro chipText">ALPHA 預覽</text>
        <text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="36" y="25" class="micro chipText">ALPHA 预览</text>
        <text x="36" y="25" class="micro chipText">ALPHA PREVIEW</text>
      </switch>
    </g>
    <text x="0" y="142" class="title text">PCL Nexa</text>
    <switch>
      <text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="2" y="202" class="h2 secondary">更輕、更快，也更像一個現代桌面應用。</text>
      <text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="2" y="202" class="h2 secondary">更轻、更快，也更像一个现代桌面应用。</text>
      <text x="2" y="202" class="h2 secondary">A lighter, faster, more modern Minecraft launcher.</text>
    </switch>
    <switch>
      <text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="2" y="252" class="body secondary">為 PCL N 使用者打造的下一代體驗，從啟動、安裝到帳號管理重新整理。</text>
      <text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="2" y="252" class="body secondary">为 PCL N 用户打造的下一代体验，从启动、安装到账号管理重新整理。</text>
      <text x="2" y="252" class="body secondary">The next-generation PCL experience, redesigned around the tasks you use every day.</text>
    </switch>

    <g transform="translate(0 310)">
      <rect width="1056" height="206" rx="34" class="surface" filter="url(#shadow)"/>
      <g transform="translate(30 30)">
        <rect width="84" height="84" rx="26" fill="url(#accentGradient)"/>
        <path d="M22 57V27h13l14 18 14-18h13v30H64V41L49 60 34 41v16z" fill="white"/>
      </g>
      <switch>
        <text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="146" y="62" class="micro tertiary">名稱變更</text>
        <text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="146" y="62" class="micro tertiary">名称变更</text>
        <text x="146" y="62" class="micro tertiary">NAME TRANSITION</text>
      </switch>
      <switch>
        <text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="146" y="105" class="h3 text">Alpha 結束後，產品將正式更名為 Nexa Launcher。</text>
        <text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="146" y="105" class="h3 text">Alpha 结束后，产品将正式更名为 Nexa Launcher。</text>
        <text x="146" y="105" class="h3 text">After Alpha, the product will be renamed to Nexa Launcher.</text>
      </switch>
      <switch>
        <text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="146" y="145" class="small secondary">目前仍使用「PCL Nexa」作為過渡名稱；倉庫與專案識別將保留 PCL N 血緣。</text>
        <text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="146" y="145" class="small secondary">目前仍使用“PCL Nexa”作为过渡名称；仓库与项目标识将保留 PCL N 血缘。</text>
        <text x="146" y="145" class="small secondary">“PCL Nexa” remains the transition name during Alpha; repository lineage stays PCL N.</text>
      </switch>
    </g>
  </g>

  <g transform="translate(72 700)">
    <switch>
      <text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="0" y="0" class="h2 text">把常用的事，做得更順。</text>
      <text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="0" y="0" class="h2 text">把常用的事，做得更顺。</text>
      <text x="0" y="0" class="h2 text">Everyday tasks, made smoother.</text>
    </switch>
    <switch>
      <text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="0" y="40" class="body secondary">少一些等待與跳轉，讓啟動器專注在 Minecraft 本身。</text>
      <text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="0" y="40" class="body secondary">少一些等待与跳转，让启动器专注在 Minecraft 本身。</text>
      <text x="0" y="40" class="body secondary">Less waiting and less friction between you and the game.</text>
    </switch>

    <g transform="translate(0 92)">
      <rect width="516" height="286" rx="30" class="surface2" filter="url(#softShadow)"/>
      <circle cx="48" cy="50" r="20" fill="#0A84FF"/>
      <path d="M43 39l15 11-15 11z" fill="white"/>
      <switch><text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="82" y="58" class="h3 text">啟動</text><text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="82" y="58" class="h3 text">启动</text><text x="82" y="58" class="h3 text">Launch</text></switch>
      <switch><text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="30" y="114" class="bodyStrong text">實例、帳號與 Java 選擇在一次流程裡完成。</text><text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="30" y="114" class="bodyStrong text">实例、账号与 Java 选择在一次流程里完成。</text><text x="30" y="114" class="bodyStrong text">Instances, accounts, and Java in one flow.</text></switch>
      <switch><text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="30" y="158" class="small secondary">啟動器會解析繼承、平台與設定，</text><text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="30" y="158" class="small secondary">启动器会解析继承、平台与设置，</text><text x="30" y="158" class="small secondary">Nexa resolves the details behind the launch,</text></switch>
      <switch><text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="30" y="188" class="small secondary">讓你只需要選擇要玩的版本與身份。</text><text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="30" y="188" class="small secondary">让你只需要选择要玩的版本与身份。</text><text x="30" y="188" class="small secondary">so you can focus on the instance and identity.</text></switch>
      <line x1="30" y1="228" x2="486" y2="228" class="rule"/>
      <switch><text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="30" y="260" class="caption secondary">原版 · ModLoader · 多實例</text><text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="30" y="260" class="caption secondary">原版 · ModLoader · 多实例</text><text x="30" y="260" class="caption secondary">Vanilla · ModLoader · multi-instance</text></switch>
    </g>

    <g transform="translate(540 92)">
      <rect width="516" height="286" rx="30" class="surface2" filter="url(#softShadow)"/>
      <circle cx="48" cy="50" r="20" fill="#34C759"/>
      <path d="M39 50h18M48 41v18" stroke="white" stroke-width="3" stroke-linecap="round"/>
      <switch><text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="82" y="58" class="h3 text">安裝與更新</text><text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="82" y="58" class="h3 text">安装与更新</text><text x="82" y="58" class="h3 text">Install &amp; update</text></switch>
      <switch><text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="30" y="114" class="bodyStrong text">支援斷點續傳、分段下載與安全更新。</text><text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="30" y="114" class="bodyStrong text">支持断点续传、分段下载与安全更新。</text><text x="30" y="114" class="bodyStrong text">Resumable downloads and safer updates.</text></switch>
      <switch><text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="30" y="158" class="small secondary">遇到來源失敗可自動切換，更新在套用前</text><text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="30" y="158" class="small secondary">遇到来源失败可自动切换，更新在应用前</text><text x="30" y="158" class="small secondary">Sources can fail over automatically, while updates</text></switch>
      <switch><text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="30" y="188" class="small secondary">會經過驗證與分階段安裝。</text><text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="30" y="188" class="small secondary">会经过验证与分阶段安装。</text><text x="30" y="188" class="small secondary">are verified before staged installation.</text></switch>
      <line x1="30" y1="228" x2="486" y2="228" class="rule"/>
      <switch><text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="30" y="260" class="caption secondary">續傳 · 多來源 · 簽章驗證</text><text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="30" y="260" class="caption secondary">续传 · 多来源 · 签名验证</text><text x="30" y="260" class="caption secondary">Resume · failover · signature verification</text></switch>
    </g>

    <g transform="translate(0 402)">
      <rect width="516" height="286" rx="30" class="surface2" filter="url(#softShadow)"/>
      <circle cx="48" cy="50" r="20" fill="#AF52DE"/>
      <circle cx="48" cy="46" r="7" fill="none" stroke="white" stroke-width="2.5"/><path d="M37 63c3-8 19-8 22 0" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      <switch><text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="82" y="58" class="h3 text">帳號與外觀</text><text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="82" y="58" class="h3 text">账号与外观</text><text x="82" y="58" class="h3 text">Accounts &amp; appearance</text></switch>
      <switch><text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="30" y="114" class="bodyStrong text">Microsoft、Yggdrasil 與 LittleSkin 都在同一處。</text><text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="30" y="114" class="bodyStrong text">Microsoft、Yggdrasil 与 LittleSkin 都在同一处。</text><text x="30" y="114" class="bodyStrong text">Microsoft, Yggdrasil, and LittleSkin together.</text></switch>
      <switch><text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="30" y="158" class="small secondary">登入、切換身份，以及支援的皮膚 / 披風</text><text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="30" y="158" class="small secondary">登录、切换身份，以及支持的皮肤 / 披风</text><text x="30" y="158" class="small secondary">Sign in, switch profiles, and manage supported</text></switch>
      <switch><text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="30" y="188" class="small secondary">管理都能沿用一致的操作方式。</text><text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="30" y="188" class="small secondary">管理都能沿用一致的操作方式。</text><text x="30" y="188" class="small secondary">skin and cape flows from one place.</text></switch>
      <line x1="30" y1="228" x2="486" y2="228" class="rule"/>
      <switch><text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="30" y="260" class="caption secondary">多帳號 · OAuth · 外觀服務</text><text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="30" y="260" class="caption secondary">多账号 · OAuth · 外观服务</text><text x="30" y="260" class="caption secondary">Multi-account · OAuth · appearance services</text></switch>
    </g>

    <g transform="translate(540 402)">
      <rect width="516" height="286" rx="30" class="surface2" filter="url(#softShadow)"/>
      <circle cx="48" cy="50" r="20" fill="#FF9F0A"/>
      <path d="M39 44h18M39 50h18M39 56h13" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      <switch><text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="82" y="58" class="h3 text">新的介面</text><text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="82" y="58" class="h3 text">新的界面</text><text x="82" y="58" class="h3 text">A new interface</text></switch>
      <switch><text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="30" y="114" class="bodyStrong text">熟悉的導覽方式，重新整理成更清爽的桌面體驗。</text><text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="30" y="114" class="bodyStrong text">熟悉的导航方式，重新整理成更清爽的桌面体验。</text><text x="30" y="114" class="bodyStrong text">Familiar navigation, rebuilt for a cleaner desktop feel.</text></switch>
      <switch><text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="30" y="158" class="small secondary">啟動、安裝、資源與設定保留清楚分區，</text><text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="30" y="158" class="small secondary">启动、安装、资源与设置保留清楚分区，</text><text x="30" y="158" class="small secondary">Launch, install, resources, and settings stay</text></switch>
      <switch><text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="30" y="188" class="small secondary">並加入流暢動畫與無障礙支援。</text><text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="30" y="188" class="small secondary">并加入流畅动画与无障碍支持。</text><text x="30" y="188" class="small secondary">clearly separated, with motion and accessibility.</text></switch>
      <line x1="30" y1="228" x2="486" y2="228" class="rule"/>
      <text x="30" y="260" class="caption secondary">Experimental · Liquid Glass · Reduced Motion</text>
    </g>
  </g>

  <g transform="translate(72 1538)">
    <switch><text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="0" y="0" class="h2 text">從 PCL N 自然過渡。</text><text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="0" y="0" class="h2 text">从 PCL N 自然过渡。</text><text x="0" y="0" class="h2 text">A natural path forward from PCL N.</text></switch>
    <switch><text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="0" y="40" class="body secondary">這不是另一個無關的新啟動器，而是 PCL N 2.0 的下一階段。</text><text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="0" y="40" class="body secondary">这不是另一个无关的新启动器，而是 PCL N 2.0 的下一阶段。</text><text x="0" y="40" class="body secondary">This is the next stage of PCL N 2.0, not an unrelated launcher.</text></switch>
    <g transform="translate(0 90)">
      <rect width="1056" height="306" rx="34" class="surface" filter="url(#shadow)"/>
      <g transform="translate(34 32)"><rect width="988" height="74" rx="24" class="surface3"/><circle cx="30" cy="37" r="9" class="success"/><switch><text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="56" y="45" class="bodyStrong text">既有 1.4.x 使用者可沿升級路徑進入 2.0 系列。</text><text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="56" y="45" class="bodyStrong text">现有 1.4.x 用户可沿升级路径进入 2.0 系列。</text><text x="56" y="45" class="bodyStrong text">Existing 1.4.x users have an upgrade path into the 2.0 line.</text></switch></g>
      <g transform="translate(34 124)"><rect width="988" height="74" rx="24" class="surface3"/><circle cx="30" cy="37" r="9" class="warning"/><switch><text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="56" y="45" class="bodyStrong text">2.0 不提供向舊版本降級；Alpha 使用者應把它視為預覽版本。</text><text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="56" y="45" class="bodyStrong text">2.0 不提供向旧版本降级；Alpha 用户应把它视为预览版本。</text><text x="56" y="45" class="bodyStrong text">2.0 does not offer downgrades; Alpha should be treated as a preview.</text></switch></g>
      <g transform="translate(34 216)"><rect width="988" height="58" rx="20" class="surface3"/><switch><text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="26" y="37" class="small secondary">目前版本線：2.0.0.alpha.N · 穩定版將使用 2.0.0</text><text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="26" y="37" class="small secondary">当前版本线：2.0.0.alpha.N · 稳定版将使用 2.0.0</text><text x="26" y="37" class="small secondary">Current line: 2.0.0.alpha.N · stable release: 2.0.0</text></switch></g>
    </g>
  </g>

  <g transform="translate(72 2040)">
    <rect width="1056" height="292" rx="34" class="surface2" filter="url(#softShadow)"/>
    <switch><text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="38" y="58" class="micro tertiary">目前狀態</text><text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="38" y="58" class="micro tertiary">当前状态</text><text x="38" y="58" class="micro tertiary">CURRENT STATUS</text></switch>
    <switch><text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="38" y="106" class="h2 text">仍在 Alpha 重構與產品化階段。</text><text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="38" y="106" class="h2 text">仍在 Alpha 重构与产品化阶段。</text><text x="38" y="106" class="h2 text">Still in Alpha reconstruction and productization.</text></switch>
    <switch><text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="38" y="154" class="body secondary">核心服務與 Minecraft 啟動鏈已完成主要遷移；產品介面仍在持續補齊。</text><text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="38" y="154" class="body secondary">核心服务与 Minecraft 启动链已完成主要迁移；产品界面仍在持续补齐。</text><text x="38" y="154" class="body secondary">Core services and Minecraft launch are migrated; product UI work is still ongoing.</text></switch>
    <switch><text systemLanguage="zh-TW,zh-HK,zh-MO,zh-Hant" x="38" y="198" class="small secondary">如果你只是想日常遊玩，請優先使用已發布的穩定版本；這個分支更適合提前體驗與跟進進度。</text><text systemLanguage="zh-CN,zh-SG,zh-Hans,zh" x="38" y="198" class="small secondary">如果你只是想日常游玩，请优先使用已发布的稳定版本；这个分支更适合提前体验与跟进进度。</text><text x="38" y="198" class="small secondary">For daily play, prefer a released stable build; this branch is best for previews and progress tracking.</text></switch>
    <line x1="38" y1="232" x2="1018" y2="232" class="rule"/>
    <text x="38" y="267" class="caption secondary">PCL Nexa · PCL N 2.0 Alpha · refactor/xsr</text>
  </g>
</svg>